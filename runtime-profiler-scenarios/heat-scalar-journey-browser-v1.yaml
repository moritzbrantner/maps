schema_version: runtime-profiler/scenario/v1
id: maps-heat-scalar-journey-v1
target:
  type: browser-journey
  module: scripts/profile-heat-scalar-journey.ts
  working_directory: ..
  inherit_env:
    - HOME
    - MAPS_HEAT_SCALAR_OBSERVATION
    - PATH
    - PLAYWRIGHT_BROWSERS_PATH
    - TMPDIR
    - XDG_CACHE_HOME
run:
  warmup_iterations: 0
  measurement_iterations: 1
  timeout_seconds: 420
collectors:
  - browser-chromium
