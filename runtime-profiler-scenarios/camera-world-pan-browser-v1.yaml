schema_version: runtime-profiler/scenario/v1
id: maps-camera-world-pan-v1
target:
  type: browser-journey
  module: scripts/profile-engine-camera-journey.ts
  working_directory: ..
  inherit_env:
    - HOME
    - MAPS_RUNTIME_PROFILE_IMPLEMENTATION
    - PLAYWRIGHT_BROWSERS_PATH
    - XDG_CACHE_HOME
run:
  warmup_iterations: 0
  measurement_iterations: 1
  timeout_seconds: 45
collectors:
  - browser-chromium
