<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Maps without React</title>
    <style>
      body {
        margin: 0;
        background: #edf2f7;
        font: 16px system-ui;
        color: #172b42;
      }
      main {
        width: 760px;
        margin: 40px auto;
        padding: 28px;
        background: white;
        border-radius: 12px;
      }
      h1 {
        font-size: 25px;
      }
      #map {
        position: relative;
        height: 480px;
        width: 100%;
        overflow: hidden;
        background: #f9f4ee;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #layers {
        pointer-events: none;
      }
      button {
        font: inherit;
        padding: 8px 16px;
        margin: 12px 6px 0 0;
      }
      output {
        display: block;
        margin: 12px 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Maps browser runtime — no React</h1>
      <p>
        The same input host, Rust camera, retained point data and pixel backends used by MapView.
      </p>
      <div id="map" aria-label="Standalone map">
        <canvas id="base"></canvas><canvas id="fallback"></canvas
        ><canvas id="layers" data-map-overlay-backend="canvas2d"></canvas>
      </div>
      <button id="zoom">Zoom in</button><button id="dispose">Dispose runtime</button
      ><output id="picked">No selection</output>
    </main>
    <script type="module" src="./browser-host.ts"></script>
  </body>
</html>
