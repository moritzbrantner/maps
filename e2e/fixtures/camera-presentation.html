<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Maps camera presentation acceptance</title>
    <style>
      body {
        margin: 0;
        background: #edf2f7;
        color: #172b42;
        font:
          16px system-ui,
          sans-serif;
      }
      main {
        width: 760px;
        margin: 40px auto;
        padding: 28px;
        background: white;
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 25px;
      }
      p {
        line-height: 1.5;
      }
      .surface {
        width: 720px;
        height: 360px;
        position: relative;
        background: #f7fafc;
        border: 1px solid #bacbdb;
      }
      .surface canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      button {
        margin: 10px 8px 0 0;
        padding: 8px 14px;
        font: inherit;
      }
      output {
        display: block;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./camera-presentation.tsx"></script>
  </body>
</html>
