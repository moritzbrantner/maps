name: Patch wgpu inertia acceptance

on:
  push:
    branches:
      - feat/maps-wgpu-base-map
    paths:
      - .github/workflows/patch-wgpu-inertia.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: feat/maps-wgpu-base-map
      - name: Move inertia snapshot to pointer release
        run: >-
          python3 -c 'from pathlib import Path; p=Path("e2e/maps-runtime.spec.ts"); s=p.read_text(); old="  await page.mouse.up();\n\n  await expect.poll(async () => viewState.textContent()).not.toBe(zoomedViewState);\n  await expect.poll(async () => overlayPointPosition(page)).not.toEqual(zoomedPointPosition);\n\n  const releasedViewState = await viewState.textContent();\n  await expect.poll(async () => viewState.textContent()).not.toBe(releasedViewState);\n"; new="  await page.mouse.up();\n  const releasedViewState = await viewState.textContent();\n\n  await expect.poll(async () => viewState.textContent()).not.toBe(zoomedViewState);\n  await expect.poll(async () => overlayPointPosition(page)).not.toEqual(zoomedPointPosition);\n  await expect.poll(async () => viewState.textContent()).not.toBe(releasedViewState);\n"; assert old in s; p.write_text(s.replace(old,new,1))'
      - name: Remove temporary workflows and push repair
        run: |
          rm -f .github/workflows/repair-wgpu-base-map.yml .github/workflows/patch-wgpu-inertia.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize wgpu inertia acceptance"
          git push origin HEAD:feat/maps-wgpu-base-map
