name: Format PR 92 package

on:
  push:
    branches:
      - feat/maps-independent-runtime

permissions:
  contents: write
  packages: read

jobs:
  format-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: feat/maps-independent-runtime
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        env:
          GH_PACKAGES_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile

      - name: Format package manifest
        run: bunx oxfmt --write package.json

      - name: Commit formatter output
        run: |
          if git diff --quiet -- package.json; then
            echo "package.json is already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Format audited package manifest"
          git push origin HEAD:feat/maps-independent-runtime
