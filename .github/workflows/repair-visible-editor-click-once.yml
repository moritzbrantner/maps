name: Repair visible editor click once

on:
  push:
    branches:
      - feat/maps-canvas-renderer-showcase

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/maps-canvas-renderer-showcase
      - name: Keep polygon selection click inside viewport
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("e2e/maps-interactions.spec.ts")
          text = path.read_text()
          old = (
              '  await clickFeatureCoordinate(page, "geojson", "geojson-polygon");\n'
              '  await expect(\n'
              '    page.getByLabel("Selected GeoJSON element").getByText("Polygon", { exact: true }),\n'
              '  ).toBeVisible();\n'
          )
          new = (
              '  const visiblePolygonPoint = await projectFeature(page, [10.8, 48.2]);\n'
              '  await page.mouse.click(visiblePolygonPoint.x, visiblePolygonPoint.y);\n'
              '  await expect(\n'
              '    page.getByLabel("Selected GeoJSON element").getByText("Polygon", { exact: true }),\n'
              '  ).toBeVisible();\n'
          )
          if text.count(old) != 1:
              raise SystemExit("expected exactly one polygon selection assertion to repair")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/repair-visible-editor-click-once.yml
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add e2e/maps-interactions.spec.ts
          git diff --cached --check
          git commit -m "test: keep polygon selection click visible"
          git push
