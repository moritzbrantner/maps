name: Repository foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set up exact Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Set up exact Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Prepare declared environment
        run: bash scripts/codex-environment.sh setup

      - name: Require setup to preserve environment identity inputs
        run: |
          git diff --exit-code -- \
            package.json \
            bun.lock \
            .node-version \
            .repository-environment.toml

      - name: Verify environment identity
        uses: moritzbrantner/coding-tooling@b6abbc6428c78639a32521ec23297dfc357690b1
        with:
          operation: environment-verify
          bun-version: 1.4.0
          install-mode: none
          report-path: .artifacts/coding-tooling/environment.json

      - name: Verify repository conformance
        uses: moritzbrantner/coding-tooling@b6abbc6428c78639a32521ec23297dfc357690b1
        with:
          operation: conformance
          bun-version: 1.4.0
          install-mode: none
          report-path: .artifacts/coding-tooling/conformance.json

      - name: Run fast repository gate
        uses: moritzbrantner/coding-tooling@b6abbc6428c78639a32521ec23297dfc357690b1
        with:
          operation: run
          tier: fast
          strict: true
          bun-version: 1.4.0
          install-mode: none
          report-path: .artifacts/coding-tooling/fast.json
