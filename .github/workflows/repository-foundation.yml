name: Repository foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Prepare declared environment
        run: bash scripts/codex-environment.sh setup

      - name: Require setup to preserve environment identity inputs
        run: |
          git diff --exit-code -- \
            package.json \
            bun.lock \
            .repository-environment.toml

      - name: Verify environment identity
        uses: moritzbrantner/coding-tooling@b1e60179e2b02f64784435206af9d3980521b766
        with:
          operation: environment-verify
          bun-version: 1.3.14
          install-mode: none
          report-path: .artifacts/coding-tooling/environment.json

      - name: Verify repository conformance
        uses: moritzbrantner/coding-tooling@b1e60179e2b02f64784435206af9d3980521b766
        with:
          operation: conformance
          bun-version: 1.3.14
          install-mode: none
          report-path: .artifacts/coding-tooling/conformance.json

      - name: Run fast repository gate
        uses: moritzbrantner/coding-tooling@b1e60179e2b02f64784435206af9d3980521b766
        with:
          operation: run
          tier: fast
          strict: true
          bun-version: 1.3.14
          install-mode: none
          report-path: .artifacts/coding-tooling/fast.json
