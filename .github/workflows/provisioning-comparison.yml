name: Maps Provisioning Comparison

# Optional issue #211 experiment: conventional Ubuntu, Ubuntu + locked Nix and a
# prebuilt digest-pinned agent image run the identical Rust/WASM task on the
# same hosted runner class. Manual only; never a required check.
on:
  workflow_dispatch:
    inputs:
      samples:
        description: JSON array of independent sample ids per variant and cache mode
        default: "[1, 2, 3, 4, 5]"
        type: string

permissions:
  contents: read

concurrency:
  group: maps-provisioning-comparison
  cancel-in-progress: false

jobs:
  agent-image:
    name: Build and push digest-pinned agent image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and push image
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-provisioning-agent"
          tag="${repository}:run-${GITHUB_RUN_ID}"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --file .github/provisioning/agent-image.Dockerfile --tag "$tag" .
          docker push "$tag"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$tag")"
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "Agent image: \`$digest\`"
            echo
            docker image ls "$repository"
          } >> "$GITHUB_STEP_SUMMARY"

  cold:
    name: Cold
    needs: agent-image
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu, nix, container]
        sample: ${{ fromJSON(inputs.samples) }}
    uses: ./.github/workflows/provisioning-sample.yml
    with:
      variant: ${{ matrix.variant }}
      cache_mode: cold
      sample: ${{ matrix.sample }}
      image: ${{ needs.agent-image.outputs.image }}

  prime:
    name: Prime persisted caches
    needs: agent-image
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu, nix, container]
    uses: ./.github/workflows/provisioning-sample.yml
    with:
      variant: ${{ matrix.variant }}
      cache_mode: prime
      sample: "0"
      image: ${{ needs.agent-image.outputs.image }}

  warm:
    name: Warm
    needs: [agent-image, prime]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu, nix, container]
        sample: ${{ fromJSON(inputs.samples) }}
    uses: ./.github/workflows/provisioning-sample.yml
    with:
      variant: ${{ matrix.variant }}
      cache_mode: warm
      sample: ${{ matrix.sample }}
      image: ${{ needs.agent-image.outputs.image }}

  cleanup:
    name: Delete experiment caches
    needs: [cold, warm]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Delete this run's persisted caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for variant in ubuntu nix container; do
            gh cache delete --repo "$GITHUB_REPOSITORY" \
              "maps-provisioning-${variant}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
          done
