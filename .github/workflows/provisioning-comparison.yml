name: Maps Provisioning Comparison

# Optional issue #211 experiment: conventional Ubuntu and a prebuilt
# digest-pinned agent image run the identical Rust/WASM task on the same hosted
# runner class. (The locked Nix variant was retired on 2026-11-11.) Manual only;
# never a required check.
on:
  workflow_dispatch:
    inputs:
      samples:
        description: JSON array of independent sample ids per variant and cache mode
        default: "[1, 2, 3, 4, 5]"
        type: string

permissions:
  contents: read

concurrency:
  group: maps-provisioning-comparison
  cancel-in-progress: false

jobs:
  agent-image:
    name: Build prebuilt agent image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GHCR rejected GITHUB_TOKEN pushes for a new Maps package (runs 42440205152,
      # 42440385717), so the image travels as a short-lived run artifact and samples
      # verify its content-addressed image id after loading it.
      - name: Build and export image
        id: build
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker build --file .github/provisioning/agent-image.Dockerfile --tag maps-agent-env:candidate .
          built=$(date +%s)
          mkdir -p "$RUNNER_TEMP/agent-image"
          docker save maps-agent-env:candidate | zstd -T0 -3 > "$RUNNER_TEMP/agent-image/agent-image.tar.zst"
          image_id="$(docker image inspect --format '{{.Id}}' maps-agent-env:candidate)"
          echo "image=$image_id" >> "$GITHUB_OUTPUT"
          {
            echo "| Agent image | Build | Export | Compressed size |"
            echo "| --- | ---: | ---: | ---: |"
            echo "| \`$image_id\` | $(( built - start )) s | $(( $(date +%s) - built )) s | $(du -h "$RUNNER_TEMP/agent-image/agent-image.tar.zst" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maps-agent-image
          path: ${{ runner.temp }}/agent-image/agent-image.tar.zst
          compression-level: 0
          retention-days: 1

  cold:
    name: Cold
    needs: agent-image
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu, container]
        sample: ${{ fromJSON(inputs.samples) }}
    uses: ./.github/workflows/provisioning-sample.yml
    with:
      variant: ${{ matrix.variant }}
      cache_mode: cold
      sample: ${{ matrix.sample }}
      image: ${{ needs.agent-image.outputs.image }}

  prime:
    name: Prime persisted caches
    needs: agent-image
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu, container]
    uses: ./.github/workflows/provisioning-sample.yml
    with:
      variant: ${{ matrix.variant }}
      cache_mode: prime
      sample: "0"
      image: ${{ needs.agent-image.outputs.image }}

  warm:
    name: Warm
    needs: [agent-image, prime]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu, container]
        sample: ${{ fromJSON(inputs.samples) }}
    uses: ./.github/workflows/provisioning-sample.yml
    with:
      variant: ${{ matrix.variant }}
      cache_mode: warm
      sample: ${{ matrix.sample }}
      image: ${{ needs.agent-image.outputs.image }}

  cleanup:
    name: Delete experiment caches
    needs: [cold, warm]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Delete this run's persisted caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for variant in ubuntu container; do
            gh cache delete --repo "$GITHUB_REPOSITORY" \
              "maps-provisioning-${variant}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
          done
