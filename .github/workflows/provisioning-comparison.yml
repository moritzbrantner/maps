name: Maps Provisioning Comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: "${{ matrix.variant }} cold sample ${{ matrix.sample }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu, nix]
        sample: [1, 2, 3, 4, 5]
    steps:
      - name: Check out the identical source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Conventional Rust setup
        if: matrix.variant == 'ubuntu'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Conventional Bun setup
        if: matrix.variant == 'ubuntu'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Conventional Node setup
        if: matrix.variant == 'ubuntu'
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
      - name: Conventional verified wasm-bindgen tool
        if: matrix.variant == 'ubuntu'
        run: bash scripts/install-wasm-bindgen-ci.sh
      - name: Install Nix
        if: matrix.variant == 'nix'
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.2
          enable-kvm: false
      - name: Activate locked Nix CLI environment
        if: matrix.variant == 'nix'
        run: |
          nix develop --command bash -c 'printf "%s\n" "$PATH" >> "$GITHUB_PATH"'
      - name: Record toolchain identity
        run: |
          set -euo pipefail
          echo "Commit: $(git rev-parse HEAD)"
          echo "Flake lock digest: $(sha256sum flake.lock)"
          echo "Cargo lock digest: $(sha256sum Cargo.lock)"
          echo "Bun lock digest: $(sha256sum bun.lock)"
          rustc --version
          cargo --version
          bun --version
          node --version
          wasm-bindgen --version
      - name: Install identical package dependencies
        run: bun install --frozen-lockfile
      - name: Execute identical Rust and WASM verification
        run: |
          set -euo pipefail
          bun run verify:rust
          bun run build:wasm
          test -s dist/wasm/maps_wasm_bg.wasm
      - name: Record independent experimental sample
        if: always()
        env:
          VARIANT: ${{ matrix.variant }}
          SAMPLE: ${{ matrix.sample }}
        run: |
          echo "| Provisioner | Cache state | Sample | Source |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | ---: | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| $VARIANT | cold; no restored Actions caches | $SAMPLE | $GITHUB_SHA |" >> "$GITHUB_STEP_SUMMARY"
