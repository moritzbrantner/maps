name: Format Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Print formatter rewrite
        run: |
          bunx oxfmt demo/rust-runtime-status.ts
          git diff -- demo/rust-runtime-status.ts
