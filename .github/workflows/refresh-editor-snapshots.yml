name: Refresh editor snapshots

on:
  push:
    branches:
      - decouple-ui

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: decouple-ui
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Refresh intentional editor baselines
        run: >-
          bunx playwright test e2e/maps-demo.spec.ts
          --project=chromium
          --update-snapshots
          --grep "Editor view visual baseline|Editor mode controls update"
      - name: Commit editor snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-editor-snapshots.yml
          git add e2e/__screenshots__/maps-demo.spec.ts
          git commit -m 'test: accept decoupled editor chrome baselines'
          git push origin HEAD:decouple-ui
