name: Bootstrap wgpu base map

on:
  push:
    branches:
      - feat/maps-wgpu-base-map
    paths:
      - .github/workflows/bootstrap-wgpu-base-map.yml

permissions:
  contents: write
  packages: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/maps-wgpu-base-map
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: "24"
      - name: Apply wgpu base-map slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "Cargo.toml",
              'wasm-bindgen = "=0.2.128"\n',
              'wasm-bindgen = "=0.2.128"\nwasm-bindgen-futures = "=0.4.77"\nweb-sys = { version = "=0.3.105", features = ["HtmlCanvasElement", "ImageBitmap"] }\nwgpu = { version = "=30.0.1", default-features = false, features = ["std", "webgpu", "wgsl"] }\n',
          )

          replace_once(
              "crates/maps-wasm/Cargo.toml",
              '[target.\'cfg(all(target_arch = "wasm32", target_os = "unknown"))\'.dependencies]\ngetrandom = { workspace = true, features = ["wasm_js"] }\n',
              '[target.\'cfg(all(target_arch = "wasm32", target_os = "unknown"))\'.dependencies]\ngetrandom = { workspace = true, features = ["wasm_js"] }\nwasm-bindgen-futures.workspace = true\nweb-sys.workspace = true\nwgpu.workspace = true\n',
          )

          replace_once(
              "crates/maps-wasm/src/lib.rs",
              "mod engine_scenario;\n",
              'mod engine_scenario;\n#[cfg(all(target_arch = "wasm32", target_os = "unknown"))]\nmod wgpu_base_map;\n',
          )

          canvas_path = Path("src/canvas-flat-runtime.tsx")
          canvas = canvas_path.read_text()
          canvas = canvas.replace(
              'import { useEffect, useRef } from "react";',
              'import { useEffect, useRef, useState } from "react";',
              1,
          )
          anchor = '} from "./flat-runtime-wasm";\n'
          if anchor not in canvas:
              raise SystemExit("flat-runtime import anchor missing")
          canvas = canvas.replace(
              anchor,
              anchor + 'import {\n  loadMapsWgpuBaseMapRenderer,\n  type MapsWgpuBaseMapRenderer,\n} from "./wgpu-base-map-wasm";\n',
              1,
          )
          canvas = canvas.replace(
              '  const canvasRef = useRef<HTMLCanvasElement | null>(null);\n  const runtimeRef = useRef<MapsFlatRasterRuntime | null>(null);',
              '  const canvasRef = useRef<HTMLCanvasElement | null>(null);\n  const fallbackCanvasRef = useRef<HTMLCanvasElement | null>(null);\n  const rendererRef = useRef<MapsWgpuBaseMapRenderer | null>(null);\n  const runtimeRef = useRef<MapsFlatRasterRuntime | null>(null);\n  const [baseRenderer, setBaseRenderer] = useState<"pending" | "wgpu" | "canvas2d">("pending");',
              1,
          )
          canvas = canvas.replace(
              '      const canvas = canvasRef.current;\n      if (!canvas) return;\n\n      const size = getCanvasCssSize(canvas);',
              '      const canvas = canvasRef.current;\n      const fallbackCanvas = fallbackCanvasRef.current;\n      if (!canvas || !fallbackCanvas) return;\n\n      resizeCanvasBackingStore(canvas);\n      resizeCanvasBackingStore(fallbackCanvas);\n      const size = getCanvasCssSize(canvas);',
              1,
          )
          old_init = '''      runtimeRef.current = runtime;\n      resizeCanvasBackingStore(canvas);\n\n      const syncFrame = createFrameSynchronizer({\n        canvas,\n        images: imagesRef.current,\n        loads: loadsRef.current,\n        runtime,\n        source: () => sourceRef.current,\n        onError: (error) => onErrorRef.current?.(error),\n      });'''
          new_init = '''      let renderer: MapsWgpuBaseMapRenderer | null = null;\n      try {\n        renderer = await loadMapsWgpuBaseMapRenderer(canvas, wasmPackage);\n      } catch {\n        renderer = null;\n      }\n\n      if (cancelled) {\n        renderer?.dispose();\n        runtime.dispose();\n        return;\n      }\n\n      runtimeRef.current = runtime;\n      rendererRef.current = renderer;\n      setBaseRenderer(renderer ? "wgpu" : "canvas2d");\n\n      const activateCanvasFallback = () => {\n        rendererRef.current?.dispose();\n        rendererRef.current = null;\n        setBaseRenderer("canvas2d");\n      };\n\n      const syncFrame = createFrameSynchronizer({\n        canvas,\n        fallbackCanvas,\n        images: imagesRef.current,\n        loads: loadsRef.current,\n        renderer: () => rendererRef.current,\n        runtime,\n        source: () => sourceRef.current,\n        onError: (error) => onErrorRef.current?.(error),\n        onRendererFailure: activateCanvasFallback,\n      });'''
          if old_init not in canvas:
              raise SystemExit("runtime initialization anchor missing")
          canvas = canvas.replace(old_init, new_init, 1)
          canvas = canvas.replace(
              '        resizeCanvasBackingStore(canvas);\n        runtime.resize(nextSize.width, nextSize.height);',
              '        resizeCanvasBackingStore(canvas);\n        resizeCanvasBackingStore(fallbackCanvas);\n        try {\n          rendererRef.current?.resize(canvas.width, canvas.height);\n        } catch {\n          activateCanvasFallback();\n        }\n        runtime.resize(nextSize.width, nextSize.height);',
              1,
          )
          canvas = canvas.replace(
              '      runtimeRef.current?.dispose();\n      runtimeRef.current = null;',
              '      rendererRef.current?.dispose();\n      rendererRef.current = null;\n      runtimeRef.current?.dispose();\n      runtimeRef.current = null;',
              1,
          )
          canvas = canvas.replace(
              '      data-flat-runtime="maps"\n      ref={canvasRef}',
              '      data-flat-runtime="maps"\n      data-map-base-renderer={baseRenderer}\n      data-map-base-tiles="0"\n      ref={canvasRef}',
              1,
          )
          tail = '''      }}\n    />\n  );\n}\n\nfunction createFrameSynchronizer({'''
          if tail not in canvas:
              raise SystemExit("component tail anchor missing")
          canvas = canvas.replace(
              tail,
              '''      }}\n    />\n      <canvas\n        aria-hidden="true"\n        className="mb-maps__canvas mb-maps__canvas-flat"\n        data-map-base-fallback="canvas2d"\n        ref={fallbackCanvasRef}\n        style={{\n          display: baseRenderer === "canvas2d" ? "block" : "none",\n          pointerEvents: "none",\n          touchAction: "none",\n        }}\n      />\n    </>\n  );\n}\n\nfunction createFrameSynchronizer({''',
              1,
          )
          canvas = canvas.replace('  return (\n    <canvas\n', '  return (\n    <>\n      <canvas\n', 1)

          start = canvas.index("function createFrameSynchronizer({")
          end = canvas.index("\nfunction frameViewState", start)
          synchronizer = r'''function createFrameSynchronizer({
  canvas,
  fallbackCanvas,
  images,
  loads,
  renderer,
  runtime,
  source,
  onError,
  onRendererFailure,
}: {
  canvas: HTMLCanvasElement;
  fallbackCanvas: HTMLCanvasElement;
  images: Map<string, ImageBitmap>;
  loads: Map<string, ActiveTileLoad>;
  renderer: () => MapsWgpuBaseMapRenderer | null;
  runtime: MapsFlatRasterRuntime;
  source: () => ReturnType<typeof resolveTileLayerOptions>;
  onError: (error: unknown) => void;
  onRendererFailure: () => void;
}) {
  function failRenderer() {
    onRendererFailure();
  }

  function renderFrame(frame: MapsFlatRasterFrame) {
    const currentRenderer = renderer();
    if (currentRenderer) {
      try {
        const drawnTiles = currentRenderer.render(
          frame.placements,
          frame.camera.width,
          frame.camera.height,
        );
        canvas.dataset.mapBaseTiles = String(drawnTiles);
        return;
      } catch {
        failRenderer();
      }
    }

    canvas.dataset.mapBaseTiles = String(drawCanvasFrame(fallbackCanvas, images, frame));
  }

  function syncFrame(): MapsFlatRasterFrame {
    let frame = runtime.frame();

    for (const tile of frame.cancellations) {
      loads.get(tile.key)?.abort.abort();
      loads.delete(tile.key);
    }
    for (const tile of frame.evictions) {
      const currentRenderer = renderer();
      if (currentRenderer) {
        try {
          currentRenderer.evictTile(tile.key);
        } catch {
          failRenderer();
        }
      }
      images.get(tile.key)?.close();
      images.delete(tile.key);
    }

    const currentSource = source();
    if (!currentSource) {
      while (frame.requests.length > 0) {
        for (const tile of frame.requests) runtime.markLoaded(tile);
        frame = runtime.frame();
      }
      renderFrame(frame);
      return frame;
    }

    renderFrame(frame);

    for (const tile of frame.requests) {
      if (loads.has(tile.key) || images.has(tile.key)) continue;
      const abort = new AbortController();
      loads.set(tile.key, { abort, tile });

      loadRasterTile(buildRasterTileUrl(currentSource.url, tile), abort.signal)
        .then((image) => {
          loads.delete(tile.key);
          if (abort.signal.aborted) {
            image.close();
            return;
          }

          images.set(tile.key, image);
          const currentRenderer = renderer();
          if (currentRenderer) {
            try {
              currentRenderer.uploadTile(tile.key, image);
            } catch {
              failRenderer();
            }
          }
          runtime.markLoaded(tile);
          syncFrame();
        })
        .catch((error) => {
          loads.delete(tile.key);
          if (abort.signal.aborted) return;
          runtime.markFailed(tile);
          onError(error);
        });
    }

    return frame;
  }

  return syncFrame;
}
'''
          canvas = canvas[:start] + synchronizer + canvas[end:]
          canvas = canvas.replace(
              'function drawFrame(\n  canvas: HTMLCanvasElement,\n  images: Map<string, ImageBitmap>,\n  frame: MapsFlatRasterFrame,\n) {',
              'function drawCanvasFrame(\n  canvas: HTMLCanvasElement,\n  images: Map<string, ImageBitmap>,\n  frame: MapsFlatRasterFrame,\n) {',
              1,
          )
          canvas = canvas.replace(
              '  const context = canvas.getContext("2d");\n  if (!context) return;',
              '  const context = canvas.getContext("2d");\n  if (!context) return 0;',
              1,
          )
          canvas = canvas.replace(
              '  for (const placement of frame.placements) {\n    const image = images.get(placement.tile.key);\n    if (!image) continue;\n    context.drawImage(',
              '  let drawnTiles = 0;\n  for (const placement of frame.placements) {\n    const image = images.get(placement.tile.key);\n    if (!image) continue;\n    context.drawImage(',
              1,
          )
          canvas = canvas.replace(
              '      placement.screenHeight,\n    );\n  }\n}\n\nfunction resizeCanvasBackingStore',
              '      placement.screenHeight,\n    );\n    drawnTiles += 1;\n  }\n\n  return drawnTiles;\n}\n\nfunction resizeCanvasBackingStore',
              1,
          )
          canvas_path.write_text(canvas)

          demo_path = Path("demo/MapsRuntimeAcceptance.tsx")
          demo = demo_path.read_text()
          demo = demo.replace(
              'const INITIAL_VIEW_STATE: MapViewState = {',
              'const ACCEPTANCE_RASTER_TILE =\n  "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=";\n\nconst INITIAL_VIEW_STATE: MapViewState = {',
              1,
          )
          demo = demo.replace(
              '        intentionally uses no MapLibre instance and no raster network source so interaction evidence\n        stays deterministic.',
              '        intentionally uses no MapLibre instance. A deterministic embedded raster tile exercises the\n        first-party base renderer without external network dependence.',
              1,
          )
          demo = demo.replace(
              '        mapStyle={{ tiles: false }}',
              '        mapStyle={{ maxZoom: 19, minZoom: 0, tileSize: 256, tiles: ACCEPTANCE_RASTER_TILE }}',
              1,
          )
          demo_path.write_text(demo)

          e2e_path = Path("e2e/maps-runtime.spec.ts")
          e2e = e2e_path.read_text()
          e2e = e2e.replace(
              '  await expect(canvas).toBeVisible();\n  await expect(overlay).toHaveCount(1);',
              '  await expect(canvas).toBeVisible();\n  await expect(canvas).toHaveAttribute("data-map-base-renderer", /^(wgpu|canvas2d)$/);\n  await expect.poll(async () => Number(await canvas.getAttribute("data-map-base-tiles"))).toBeGreaterThan(0);\n  const webGpuAdapterAvailable = await page.evaluate(async () => {\n    if (!("gpu" in navigator)) return false;\n    try {\n      return Boolean(await navigator.gpu.requestAdapter());\n    } catch {\n      return false;\n    }\n  });\n  if (webGpuAdapterAvailable) {\n    await expect(canvas).toHaveAttribute("data-map-base-renderer", "wgpu");\n  }\n  await expect(overlay).toHaveCount(1);',
              1,
          )
          e2e_path.write_text(e2e)
          PY

          cat > crates/maps-wasm/src/wgpu_base_map.rs <<'RS'
          use std::collections::HashMap;

          use serde::Deserialize;
          use wasm_bindgen::prelude::*;
          use web_sys::{HtmlCanvasElement, ImageBitmap};

          const INITIAL_VERTEX_BUFFER_SIZE: u64 = 4 * 1024;
          const VERTEX_SIZE: u64 = 16;
          const VERTICES_PER_TILE: u32 = 4;

          const BASE_MAP_SHADER: &str = r#"
          struct BaseCamera {
            viewport: vec2<f32>,
            _padding: vec2<f32>,
          };

          @group(0) @binding(0)
          var<uniform> camera: BaseCamera;

          @group(1) @binding(0)
          var raster_tile: texture_2d<f32>;

          @group(1) @binding(1)
          var raster_sampler: sampler;

          struct VertexInput {
            @location(0) position: vec2<f32>,
            @location(1) uv: vec2<f32>,
          };

          struct VertexOutput {
            @builtin(position) position: vec4<f32>,
            @location(0) uv: vec2<f32>,
          };

          @vertex
          fn vs_main(input: VertexInput) -> VertexOutput {
            let x = input.position.x / camera.viewport.x * 2.0 - 1.0;
            let y = 1.0 - input.position.y / camera.viewport.y * 2.0;
            var output: VertexOutput;
            output.position = vec4<f32>(x, y, 0.0, 1.0);
            output.uv = input.uv;
            return output;
          }

          @fragment
          fn fs_main(input: VertexOutput) -> @location(0) vec4<f32> {
            return textureSample(raster_tile, raster_sampler, input.uv);
          }
          "#;

          #[derive(Debug, Deserialize)]
          #[serde(rename_all = "camelCase")]
          struct WgpuRasterTilePlacement {
              tile: WgpuRasterTileId,
              screen_x: f64,
              screen_y: f64,
              screen_width: f64,
              screen_height: f64,
          }

          #[derive(Debug, Deserialize)]
          struct WgpuRasterTileId {
              key: String,
          }

          struct TileTexture {
              _texture: wgpu::Texture,
              _view: wgpu::TextureView,
              bind_group: wgpu::BindGroup,
          }

          #[wasm_bindgen]
          pub struct MapsWgpuBaseMapRenderer {
              surface: wgpu::Surface<'static>,
              device: wgpu::Device,
              queue: wgpu::Queue,
              config: wgpu::SurfaceConfiguration,
              camera_buffer: wgpu::Buffer,
              camera_bind_group: wgpu::BindGroup,
              texture_bind_group_layout: wgpu::BindGroupLayout,
              sampler: wgpu::Sampler,
              pipeline: wgpu::RenderPipeline,
              vertex_buffer: wgpu::Buffer,
              vertex_capacity: u64,
              tiles: HashMap<String, TileTexture>,
          }

          #[wasm_bindgen(js_name = createWgpuBaseMapRenderer)]
          pub async fn create_wgpu_base_map_renderer(
              canvas: HtmlCanvasElement,
          ) -> Result<MapsWgpuBaseMapRenderer, JsValue> {
              MapsWgpuBaseMapRenderer::new(canvas).await
          }

          #[wasm_bindgen]
          impl MapsWgpuBaseMapRenderer {
              async fn new(canvas: HtmlCanvasElement) -> Result<Self, JsValue> {
                  let instance = wgpu::Instance::default();
                  let surface: wgpu::Surface<'static> = instance
                      .create_surface(wgpu::SurfaceTarget::Canvas(canvas.clone()))
                      .map_err(|error| js_error("could not create wgpu canvas surface", error))?;
                  let adapter = instance
                      .request_adapter(&wgpu::RequestAdapterOptions {
                          compatible_surface: Some(&surface),
                          ..Default::default()
                      })
                      .await
                      .map_err(|error| js_error("could not acquire wgpu adapter", error))?;
                  let (device, queue) = adapter
                      .request_device(&wgpu::DeviceDescriptor::default())
                      .await
                      .map_err(|error| js_error("could not acquire wgpu device", error))?;
                  let width = canvas.width().max(1);
                  let height = canvas.height().max(1);
                  let mut config = surface
                      .get_default_config(&adapter, width, height)
                      .ok_or_else(|| JsValue::from_str("wgpu surface has no compatible configuration"))?;
                  config.present_mode = wgpu::PresentMode::AutoVsync;
                  surface.configure(&device, &config);

                  let camera_bind_group_layout =
                      device.create_bind_group_layout(&wgpu::BindGroupLayoutDescriptor {
                          label: Some("Maps base camera layout"),
                          entries: &[wgpu::BindGroupLayoutEntry {
                              binding: 0,
                              visibility: wgpu::ShaderStages::VERTEX,
                              ty: wgpu::BindingType::Buffer {
                                  ty: wgpu::BufferBindingType::Uniform,
                                  has_dynamic_offset: false,
                                  min_binding_size: None,
                              },
                              count: None,
                          }],
                      });
                  let texture_bind_group_layout =
                      device.create_bind_group_layout(&wgpu::BindGroupLayoutDescriptor {
                          label: Some("Maps raster tile layout"),
                          entries: &[
                              wgpu::BindGroupLayoutEntry {
                                  binding: 0,
                                  visibility: wgpu::ShaderStages::FRAGMENT,
                                  ty: wgpu::BindingType::Texture {
                                      sample_type: wgpu::TextureSampleType::Float { filterable: true },
                                      view_dimension: wgpu::TextureViewDimension::D2,
                                      multisampled: false,
                                  },
                                  count: None,
                              },
                              wgpu::BindGroupLayoutEntry {
                                  binding: 1,
                                  visibility: wgpu::ShaderStages::FRAGMENT,
                                  ty: wgpu::BindingType::Sampler(wgpu::SamplerBindingType::Filtering),
                                  count: None,
                              },
                          ],
                      });
                  let camera_buffer = device.create_buffer(&wgpu::BufferDescriptor {
                      label: Some("Maps base camera uniform"),
                      size: 16,
                      usage: wgpu::BufferUsages::UNIFORM | wgpu::BufferUsages::COPY_DST,
                      mapped_at_creation: false,
                  });
                  let camera_bind_group = device.create_bind_group(&wgpu::BindGroupDescriptor {
                      label: Some("Maps base camera bind group"),
                      layout: &camera_bind_group_layout,
                      entries: &[wgpu::BindGroupEntry {
                          binding: 0,
                          resource: camera_buffer.as_entire_binding(),
                      }],
                  });
                  let sampler = device.create_sampler(&wgpu::SamplerDescriptor {
                      label: Some("Maps raster sampler"),
                      address_mode_u: wgpu::AddressMode::ClampToEdge,
                      address_mode_v: wgpu::AddressMode::ClampToEdge,
                      address_mode_w: wgpu::AddressMode::ClampToEdge,
                      mag_filter: wgpu::FilterMode::Linear,
                      min_filter: wgpu::FilterMode::Linear,
                      mipmap_filter: wgpu::MipmapFilterMode::Nearest,
                      ..Default::default()
                  });
                  let shader = device.create_shader_module(wgpu::ShaderModuleDescriptor {
                      label: Some("Maps raster tile shader"),
                      source: wgpu::ShaderSource::Wgsl(BASE_MAP_SHADER.into()),
                  });
                  let pipeline_layout = device.create_pipeline_layout(&wgpu::PipelineLayoutDescriptor {
                      label: Some("Maps base-map pipeline layout"),
                      bind_group_layouts: &[&camera_bind_group_layout, &texture_bind_group_layout],
                      immediate_size: 0,
                  });
                  let attributes = [
                      wgpu::VertexAttribute {
                          format: wgpu::VertexFormat::Float32x2,
                          offset: 0,
                          shader_location: 0,
                      },
                      wgpu::VertexAttribute {
                          format: wgpu::VertexFormat::Float32x2,
                          offset: 8,
                          shader_location: 1,
                      },
                  ];
                  let vertex_buffers = [wgpu::VertexBufferLayout {
                      array_stride: VERTEX_SIZE,
                      step_mode: wgpu::VertexStepMode::Vertex,
                      attributes: &attributes,
                  }];
                  let pipeline = device.create_render_pipeline(&wgpu::RenderPipelineDescriptor {
                      label: Some("Maps raster tile pipeline"),
                      layout: Some(&pipeline_layout),
                      vertex: wgpu::VertexState {
                          module: &shader,
                          entry_point: Some("vs_main"),
                          compilation_options: Default::default(),
                          buffers: &vertex_buffers,
                      },
                      primitive: wgpu::PrimitiveState {
                          topology: wgpu::PrimitiveTopology::TriangleStrip,
                          ..Default::default()
                      },
                      depth_stencil: None,
                      multisample: wgpu::MultisampleState::default(),
                      fragment: Some(wgpu::FragmentState {
                          module: &shader,
                          entry_point: Some("fs_main"),
                          compilation_options: Default::default(),
                          targets: &[Some(wgpu::ColorTargetState {
                              format: config.format,
                              blend: None,
                              write_mask: wgpu::ColorWrites::ALL,
                          })],
                      }),
                      multiview_mask: None,
                      cache: None,
                  });
                  let vertex_buffer = create_vertex_buffer(&device, INITIAL_VERTEX_BUFFER_SIZE);

                  Ok(Self {
                      surface,
                      device,
                      queue,
                      config,
                      camera_buffer,
                      camera_bind_group,
                      texture_bind_group_layout,
                      sampler,
                      pipeline,
                      vertex_buffer,
                      vertex_capacity: INITIAL_VERTEX_BUFFER_SIZE,
                      tiles: HashMap::new(),
                  })
              }

              pub fn resize(&mut self, width: u32, height: u32) {
                  let width = width.max(1);
                  let height = height.max(1);
                  if self.config.width == width && self.config.height == height {
                      return;
                  }
                  self.config.width = width;
                  self.config.height = height;
                  self.surface.configure(&self.device, &self.config);
              }

              #[wasm_bindgen(js_name = uploadTile)]
              pub fn upload_tile(&mut self, key: String, image: ImageBitmap) -> Result<(), JsValue> {
                  let width = image.width();
                  let height = image.height();
                  if width == 0 || height == 0 {
                      return Err(JsValue::from_str("raster tile ImageBitmap has zero extent"));
                  }

                  let texture = self.device.create_texture(&wgpu::TextureDescriptor {
                      label: Some("Maps raster tile texture"),
                      size: wgpu::Extent3d {
                          width,
                          height,
                          depth_or_array_layers: 1,
                      },
                      mip_level_count: 1,
                      sample_count: 1,
                      dimension: wgpu::TextureDimension::D2,
                      format: wgpu::TextureFormat::Rgba8UnormSrgb,
                      usage: wgpu::TextureUsages::COPY_DST | wgpu::TextureUsages::TEXTURE_BINDING,
                      view_formats: &[],
                  });
                  self.queue.copy_external_image_to_texture(
                      &wgpu::CopyExternalImageSourceInfo {
                          source: wgpu::ExternalImageSource::ImageBitmap(image),
                          origin: wgpu::Origin2d::ZERO,
                          flip_y: false,
                      },
                      wgpu::CopyExternalImageDestInfo {
                          texture: &texture,
                          mip_level: 0,
                          origin: wgpu::Origin3d::ZERO,
                          aspect: wgpu::TextureAspect::All,
                          color_space: wgpu::PredefinedColorSpace::Srgb,
                          premultiplied_alpha: false,
                      },
                      wgpu::Extent3d {
                          width,
                          height,
                          depth_or_array_layers: 1,
                      },
                  );
                  let view = texture.create_view(&wgpu::TextureViewDescriptor::default());
                  let bind_group = self.device.create_bind_group(&wgpu::BindGroupDescriptor {
                      label: Some("Maps raster tile bind group"),
                      layout: &self.texture_bind_group_layout,
                      entries: &[
                          wgpu::BindGroupEntry {
                              binding: 0,
                              resource: wgpu::BindingResource::TextureView(&view),
                          },
                          wgpu::BindGroupEntry {
                              binding: 1,
                              resource: wgpu::BindingResource::Sampler(&self.sampler),
                          },
                      ],
                  });
                  self.tiles.insert(
                      key,
                      TileTexture {
                          _texture: texture,
                          _view: view,
                          bind_group,
                      },
                  );
                  Ok(())
              }

              #[wasm_bindgen(js_name = evictTile)]
              pub fn evict_tile(&mut self, key: &str) {
                  self.tiles.remove(key);
              }

              pub fn render(
                  &mut self,
                  placements: JsValue,
                  viewport_width: f64,
                  viewport_height: f64,
              ) -> Result<usize, JsValue> {
                  if !viewport_width.is_finite()
                      || !viewport_height.is_finite()
                      || viewport_width <= 0.0
                      || viewport_height <= 0.0
                  {
                      return Err(JsValue::from_str("invalid wgpu base-camera viewport"));
                  }

                  let placements = serde_wasm_bindgen::from_value::<Vec<WgpuRasterTilePlacement>>(
                      placements,
                  )
                  .map_err(|error| js_error("invalid wgpu raster placements", error))?;
                  let mut vertices = Vec::with_capacity(placements.len() * 4 * VERTEX_SIZE as usize);
                  for placement in &placements {
                      append_tile_vertices(&mut vertices, placement)?;
                  }

                  let required = vertices.len() as u64;
                  if required > self.vertex_capacity {
                      let capacity = required.next_power_of_two().max(INITIAL_VERTEX_BUFFER_SIZE);
                      self.vertex_buffer = create_vertex_buffer(&self.device, capacity);
                      self.vertex_capacity = capacity;
                  }
                  if !vertices.is_empty() {
                      self.queue.write_buffer(&self.vertex_buffer, 0, &vertices);
                  }
                  self.queue.write_buffer(
                      &self.camera_buffer,
                      0,
                      &camera_uniform_bytes(viewport_width as f32, viewport_height as f32),
                  );

                  let Some(surface_frame) = self.acquire_surface_frame()? else {
                      return Ok(0);
                  };
                  let view = surface_frame
                      .texture
                      .create_view(&wgpu::TextureViewDescriptor::default());
                  let mut encoder = self
                      .device
                      .create_command_encoder(&wgpu::CommandEncoderDescriptor {
                          label: Some("Maps base-map command encoder"),
                      });
                  let color_attachments = [Some(wgpu::RenderPassColorAttachment {
                      view: &view,
                      depth_slice: None,
                      resolve_target: None,
                      ops: wgpu::Operations {
                          load: wgpu::LoadOp::Clear(wgpu::Color {
                              r: 0.0,
                              g: 0.0,
                              b: 0.0,
                              a: 0.0,
                          }),
                          store: wgpu::StoreOp::Store,
                      },
                  })];
                  let mut drawn_tiles = 0;
                  {
                      let mut pass = encoder.begin_render_pass(&wgpu::RenderPassDescriptor {
                          label: Some("Maps base-map render pass"),
                          color_attachments: &color_attachments,
                          depth_stencil_attachment: None,
                          timestamp_writes: None,
                          occlusion_query_set: None,
                          multiview_mask: None,
                      });
                      pass.set_pipeline(&self.pipeline);
                      pass.set_bind_group(0, &self.camera_bind_group, &[]);
                      pass.set_vertex_buffer(0, self.vertex_buffer.slice(..));

                      for (index, placement) in placements.iter().enumerate() {
                          let Some(tile) = self.tiles.get(&placement.tile.key) else {
                              continue;
                          };
                          pass.set_bind_group(1, &tile.bind_group, &[]);
                          let first = index as u32 * VERTICES_PER_TILE;
                          pass.draw(first..first + VERTICES_PER_TILE, 0..1);
                          drawn_tiles += 1;
                      }
                  }

                  self.queue.submit([encoder.finish()]);
                  self.queue.present(surface_frame);
                  Ok(drawn_tiles)
              }

              fn acquire_surface_frame(&self) -> Result<Option<wgpu::SurfaceTexture>, JsValue> {
                  use wgpu::CurrentSurfaceTexture;

                  match self.surface.get_current_texture() {
                      CurrentSurfaceTexture::Success(frame)
                      | CurrentSurfaceTexture::Suboptimal(frame) => Ok(Some(frame)),
                      CurrentSurfaceTexture::Timeout | CurrentSurfaceTexture::Occluded => Ok(None),
                      CurrentSurfaceTexture::Outdated | CurrentSurfaceTexture::Lost => {
                          self.surface.configure(&self.device, &self.config);
                          match self.surface.get_current_texture() {
                              CurrentSurfaceTexture::Success(frame)
                              | CurrentSurfaceTexture::Suboptimal(frame) => Ok(Some(frame)),
                              CurrentSurfaceTexture::Timeout | CurrentSurfaceTexture::Occluded => {
                                  Ok(None)
                              }
                              CurrentSurfaceTexture::Outdated => {
                                  Err(JsValue::from_str("wgpu surface remained outdated after reconfigure"))
                              }
                              CurrentSurfaceTexture::Lost => {
                                  Err(JsValue::from_str("wgpu surface remained lost after reconfigure"))
                              }
                              CurrentSurfaceTexture::Validation => {
                                  Err(JsValue::from_str("wgpu surface validation failure"))
                              }
                          }
                      }
                      CurrentSurfaceTexture::Validation => {
                          Err(JsValue::from_str("wgpu surface validation failure"))
                      }
                  }
              }
          }

          fn create_vertex_buffer(device: &wgpu::Device, size: u64) -> wgpu::Buffer {
              device.create_buffer(&wgpu::BufferDescriptor {
                  label: Some("Maps raster placement vertices"),
                  size,
                  usage: wgpu::BufferUsages::VERTEX | wgpu::BufferUsages::COPY_DST,
                  mapped_at_creation: false,
              })
          }

          fn append_tile_vertices(
              output: &mut Vec<u8>,
              placement: &WgpuRasterTilePlacement,
          ) -> Result<(), JsValue> {
              let values = [
                  placement.screen_x,
                  placement.screen_y,
                  placement.screen_width,
                  placement.screen_height,
              ];
              if values.iter().any(|value| !value.is_finite())
                  || placement.screen_width <= 0.0
                  || placement.screen_height <= 0.0
              {
                  return Err(JsValue::from_str("invalid raster tile screen placement"));
              }

              let left = placement.screen_x as f32;
              let top = placement.screen_y as f32;
              let right = (placement.screen_x + placement.screen_width) as f32;
              let bottom = (placement.screen_y + placement.screen_height) as f32;
              for vertex in [
                  [left, top, 0.0, 0.0],
                  [left, bottom, 0.0, 1.0],
                  [right, top, 1.0, 0.0],
                  [right, bottom, 1.0, 1.0],
              ] {
                  for value in vertex {
                      output.extend_from_slice(&value.to_le_bytes());
                  }
              }
              Ok(())
          }

          fn camera_uniform_bytes(width: f32, height: f32) -> [u8; 16] {
              let mut bytes = [0; 16];
              bytes[0..4].copy_from_slice(&width.to_le_bytes());
              bytes[4..8].copy_from_slice(&height.to_le_bytes());
              bytes
          }

          fn js_error(context: &str, error: impl std::fmt::Display) -> JsValue {
              JsValue::from_str(&format!("{context}: {error}"))
          }
          RS

          cat > src/wgpu-base-map-wasm.ts <<'TS'
          import {
            importMapsWasmModule,
            type MapsWasmModuleBase,
          } from "./aggregation-wasm";
          import type { MapsRasterTilePlacement } from "./flat-runtime-wasm";

          export type MapsWgpuBaseMapRenderer = {
            dispose(): void;
            evictTile(key: string): void;
            render(
              placements: MapsRasterTilePlacement[],
              viewportWidth: number,
              viewportHeight: number,
            ): number;
            resize(width: number, height: number): void;
            uploadTile(key: string, image: ImageBitmap): void;
          };

          type MapsWgpuBaseMapWasmRenderer = {
            evictTile(key: string): void;
            free?: () => void;
            render(
              placements: MapsRasterTilePlacement[],
              viewportWidth: number,
              viewportHeight: number,
            ): number;
            resize(width: number, height: number): void;
            uploadTile(key: string, image: ImageBitmap): void;
          };

          type MapsWgpuBaseMapWasmModule = MapsWasmModuleBase & {
            createWgpuBaseMapRenderer?: (
              canvas: HTMLCanvasElement,
            ) => Promise<MapsWgpuBaseMapWasmRenderer>;
          };

          export async function loadMapsWgpuBaseMapRenderer(
            canvas: HTMLCanvasElement,
            packageName?: string,
          ): Promise<MapsWgpuBaseMapRenderer> {
            const wasmModule = await importMapsWasmModule<MapsWgpuBaseMapWasmModule>(packageName);
            await wasmModule.default?.();
            const createRenderer = wasmModule.createWgpuBaseMapRenderer;

            if (!createRenderer) {
              throw new Error("Maps WASM wgpu base-map renderer is unavailable.");
            }

            const renderer = await createRenderer(canvas);
            let disposed = false;

            return {
              dispose() {
                if (disposed) return;
                disposed = true;
                renderer.free?.();
              },
              evictTile(key) {
                assertLive(disposed);
                renderer.evictTile(key);
              },
              render(placements, viewportWidth, viewportHeight) {
                assertLive(disposed);
                return renderer.render(placements, viewportWidth, viewportHeight);
              },
              resize(width, height) {
                assertLive(disposed);
                renderer.resize(width, height);
              },
              uploadTile(key, image) {
                assertLive(disposed);
                renderer.uploadTile(key, image);
              },
            };
          }

          function assertLive(disposed: boolean) {
            if (disposed) {
              throw new Error("Maps wgpu base-map renderer has been disposed.");
            }
          }
          TS

          cargo fmt --all
          cargo generate-lockfile

      - name: Install JavaScript dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: bun install --frozen-lockfile
      - name: Format changed TypeScript
        run: bunx oxfmt --write src/canvas-flat-runtime.tsx src/wgpu-base-map-wasm.ts demo/MapsRuntimeAcceptance.tsx e2e/maps-runtime.spec.ts
      - name: Validate Rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --lib --tests --locked
          cargo check -p maps-wasm --target wasm32-unknown-unknown --locked
      - name: Validate TypeScript
        run: |
          bun run lint
          bun run check-types
          bun run build
          bun run test
      - name: Commit generated implementation and lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/maps-wasm/Cargo.toml crates/maps-wasm/src/lib.rs crates/maps-wasm/src/wgpu_base_map.rs src/canvas-flat-runtime.tsx src/wgpu-base-map-wasm.ts demo/MapsRuntimeAcceptance.tsx e2e/maps-runtime.spec.ts
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "Render the base map with wgpu"
          git push origin HEAD:feat/maps-wgpu-base-map
