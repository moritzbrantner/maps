name: Bootstrap wgpu base map

on:
  push:
    branches:
      - feat/maps-wgpu-base-map
    paths:
      - .github/workflows/bootstrap-wgpu-base-map.yml

permissions:
  contents: write
  packages: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/maps-wgpu-base-map
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: "24"
      - name: Apply integration patches
        run: |
          python3 scripts/bootstrap-wgpu-base-map.py
          sed -i 's/wasm-bindgen-futures = "=0.4.77"/wasm-bindgen-futures = "=0.4.78"/' Cargo.toml
      - name: Generate locked Rust dependency graph
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Install JavaScript dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: bun install --frozen-lockfile
      - name: Format changed TypeScript
        run: bunx oxfmt --write src/canvas-flat-runtime.tsx src/wgpu-base-map-wasm.ts demo/MapsRuntimeAcceptance.tsx e2e/maps-runtime.spec.ts
      - name: Validate Rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --lib --tests --locked
          cargo check -p maps-wasm --target wasm32-unknown-unknown --locked
      - name: Validate TypeScript
        run: |
          bun run lint
          bun run check-types
          bun run build
          bun run test
      - name: Commit generated implementation and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/maps-wasm/Cargo.toml crates/maps-wasm/src/lib.rs crates/maps-wasm/src/wgpu_base_map.rs src/canvas-flat-runtime.tsx src/wgpu-base-map-wasm.ts demo/MapsRuntimeAcceptance.tsx e2e/maps-runtime.spec.ts
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "Render the base map with wgpu"
          git push origin HEAD:feat/maps-wgpu-base-map
