name: Complete Maps runtime migration

on:
  push:
    branches:
      - feat/maps-native-runtime-final

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: feat/maps-native-runtime-final
      - name: Move scalar field loader to Maps WASM
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/scalar-field.ts")
          text = path.read_text()
          old_import = '''import type { IndexedMapPoint, MapPoint, MapPointFilter } from "./aggregation";
          import type {
            createVizEngine,
            VizEngine,
            VizGeoPoint,
            VizGeoScalarFieldOptions,
            VizRenderLayer,
          } from "@moritzbrantner/viz-engine/core";
          '''
          text = text.replace(old_import, 'import type { IndexedMapPoint, MapPoint, MapPointFilter } from "./aggregation";\n')
          text = text.replace(
              'const DEFAULT_VIZ_ENGINE_PACKAGE = "@moritzbrantner/viz-engine/core";',
              'const DEFAULT_MAPS_WASM_PACKAGE = "@moritzbrantner/maps/wasm";',
          )
          text = text.replace(
              '''type VizEngineModule = {
            createVizEngine: typeof createVizEngine;
          };
          ''',
              '''type MapsScalarFieldWasmModule = {
            createScalarFieldGrid?: (points: unknown, options: unknown) => unknown;
            default?: (moduleOrPath?: unknown) => Promise<unknown>;
          };
          ''',
          )
          old_init = '''export async function initializeMapsScalarFieldWasm(packageName = DEFAULT_VIZ_ENGINE_PACKAGE) {
            try {
              const vizEngineModule = await importOptionalVizEngineModule(packageName);
          
              scalarFieldWasmRuntime = createVizEngineScalarFieldRuntime(vizEngineModule);
              scalarFieldWasmLoadError = null;
              return true;
            } catch (error) {
              scalarFieldWasmRuntime = null;
              scalarFieldWasmLoadError = error;
              return false;
            }
          }
          '''
          new_init = '''export async function initializeMapsScalarFieldWasm(packageName = DEFAULT_MAPS_WASM_PACKAGE) {
            try {
              const wasmModule = await importOptionalMapsWasmModule(packageName);
              await wasmModule.default?.();
              const createGrid = wasmModule.createScalarFieldGrid;
          
              if (!createGrid) {
                throw new Error("Maps WASM scalar field runtime is unavailable.");
              }
          
              scalarFieldWasmRuntime = {
                createScalarFieldGrid(points, options) {
                  const grid = createGrid(points, options);
          
                  if (!isScalarFieldGrid(grid)) {
                    throw new Error("Maps WASM scalar field runtime returned an invalid grid.");
                  }
          
                  return grid;
                },
              };
              scalarFieldWasmLoadError = null;
              return true;
            } catch (error) {
              scalarFieldWasmRuntime = null;
              scalarFieldWasmLoadError = error;
              return false;
            }
          }
          '''
          if old_init not in text:
              raise SystemExit("scalar-field initialization block did not match")
          text = text.replace(old_init, new_init)
          marker = "function toGeoVizScalarFieldOptions"
          if marker not in text:
              raise SystemExit("viz-engine scalar-field tail did not match")
          text = text[:text.index(marker)] + '''function isScalarFieldGrid(value: unknown): value is ScalarFieldGrid {
            if (!value || typeof value !== "object") return false;
          
            const candidate = value as Partial<ScalarFieldGrid>;
            return (
              Array.isArray(candidate.bounds) &&
              candidate.bounds.length === 4 &&
              candidate.bounds.every(Number.isFinite) &&
              Number.isInteger(candidate.columns) &&
              (candidate.columns ?? -1) >= 0 &&
              Number.isInteger(candidate.rows) &&
              (candidate.rows ?? -1) >= 0 &&
              Array.isArray(candidate.values) &&
              candidate.values.length === (candidate.columns ?? 0) * (candidate.rows ?? 0)
            );
          }
          
          async function importOptionalMapsWasmModule(
            packageName: string,
          ): Promise<MapsScalarFieldWasmModule> {
            const dynamicImport = new Function("specifier", "return import(specifier)") as (
              specifier: string,
            ) => Promise<MapsScalarFieldWasmModule>;
          
            return dynamicImport(packageName);
          }
          '''
          path.write_text(text)

          docs = Path("docs/performance.md")
          doc_text = docs.read_text()
          old_docs = '''`initializeMapsScalarFieldWasm(...)` can opt into the engine-backed scalar-field
          path provided by the required `@moritzbrantner/viz-engine/core` entrypoint. If
          initialization fails, scalar field creation falls back to TypeScript and
          `getMapsScalarFieldWasmLoadError()` exposes the last load error.
          
          `@moritzbrantner/viz-engine@0.3.0` also exposes a lazy WASM entrypoint, but maps
          keeps the scalar-field initialization path synchronous for now. Lazy loading
          requires a separate maps-level API design because the current helper returns a
          ready-to-use runtime state.
          '''
          new_docs = '''`initializeMapsScalarFieldWasm(...)` now targets the first-party
          `@moritzbrantner/maps/wasm` boundary. A Maps WASM build that exposes scalar-field
          computation can become the fast path without introducing a second visualization
          authority. Until that export is available, initialization fails closed and scalar
          field creation continues through the deterministic TypeScript implementation;
          `getMapsScalarFieldWasmLoadError()` exposes the load/capability error.
          '''
          if old_docs not in doc_text:
              raise SystemExit("performance docs block did not match")
          docs.write_text(doc_text.replace(old_docs, new_docs))

          Path(".github/workflows/runtime-cleanup-once.yml").unlink()
          PY
      - name: Commit migration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scalar-field.ts docs/performance.md .github/workflows/runtime-cleanup-once.yml
          git commit -m "refactor: move scalar fields off viz-engine"
          git push origin HEAD:feat/maps-native-runtime-final
