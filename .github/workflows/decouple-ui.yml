name: Decouple UI package

on:
  push:
    branches:
      - decouple-ui

permissions:
  contents: write

jobs:
  decouple:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decouple-ui
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Replace shared UI dependency
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const replace = (path, from, to) => {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(from)) throw new Error(`Expected text not found in ${path}: ${from}`);
            fs.writeFileSync(path, source.replace(from, to));
          };

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete pkg.devDependencies['@moritzbrantner/ui'];
          delete pkg.peerDependencies['@moritzbrantner/ui'];
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          replace('src/temporal-controls.tsx', 'import { Button } from "@moritzbrantner/ui";\n\n', '');
          let temporal = fs.readFileSync('src/temporal-controls.tsx', 'utf8');
          temporal = temporal.replaceAll('<Button', '<button').replaceAll('</Button>', '</button>');
          fs.writeFileSync('src/temporal-controls.tsx', temporal);

          replace('demo/main.tsx', 'import "@moritzbrantner/ui/atlas/styles.css";\n', '');
          replace('demo/App.tsx', '} from "@moritzbrantner/ui";', '} from "./ui";');
          replace(
            'demo/components/HistoryDemoView.tsx',
            'import { Button } from "@moritzbrantner/ui";',
            'import { Button } from "../ui";',
          );

          for (const path of ['README.md', 'docs/getting-started.md']) {
            const source = fs.readFileSync(path, 'utf8');
            fs.writeFileSync(path, source.replaceAll(' @moritzbrantner/ui', ''));
          }

          const dependencyTable = `| Entry point | React required | Timeline editor required | Server-safe |\n| --- | --- | --- | --- |\n| \`@moritzbrantner/maps/core\` | No | No | Yes |\n| \`@moritzbrantner/maps\` | Yes | Only for timeline editor exports | No |\n| \`@moritzbrantner/maps/layers\` | Yes | No | No |\n| \`@moritzbrantner/maps/flat\` | Yes | No | No |\n| \`@moritzbrantner/maps/editor\` | Yes | Only when using timeline editor integration | No |\n| \`@moritzbrantner/maps/timeline\` | Yes | Yes for \`GeoJsonTimelineEditor\` | No |\n| \`@moritzbrantner/maps/geojson\` | Yes | No | No |\n| \`@moritzbrantner/maps/heat\` | Yes | No | No |\n| \`@moritzbrantner/maps/measurement\` | Layer: Yes, helpers: No | No | Helper imports only |\n| \`@moritzbrantner/maps/temporal\` | Maps: Yes, helpers: No | No | Helper imports only |`;
          let entrypoints = fs.readFileSync('docs/entrypoints.md', 'utf8');
          entrypoints = entrypoints.replace(
            /\| Entry point \| React required \| `@moritzbrantner\/ui` required \| Timeline editor required \| Server-safe \|[\s\S]*?\| `@moritzbrantner\/maps\/temporal` \| Maps: Yes, helpers: No \| Maps: Yes \| No \| Helper imports only \|/,
            dependencyTable,
          );
          fs.writeFileSync('docs/entrypoints.md', entrypoints);

          let adr = fs.readFileSync('docs/adr/0002-keep-core-entrypoint-server-safe.md', 'utf8');
          adr = adr.replace('MapLibre, Three, `@moritzbrantner/ui`, and timeline', 'MapLibre, Three, UI component packages, and timeline');
          fs.writeFileSync('docs/adr/0002-keep-core-entrypoint-server-safe.md', adr);

          let consumer = fs.readFileSync('scripts/verify-package-consumer.mjs', 'utf8');
          consumer = consumer.replace(/^\s*"@moritzbrantner\/ui": version\("@moritzbrantner\/ui"\),\n/m, '');
          fs.writeFileSync('scripts/verify-package-consumer.mjs', consumer);

          let bundles = fs.readFileSync('scripts/verify-entry-bundles.mjs', 'utf8');
          bundles = bundles.replace(/^\s*"@moritzbrantner\/ui",\n/m, '');
          fs.writeFileSync('scripts/verify-entry-bundles.mjs', bundles);

          let demoStyles = fs.readFileSync('demo/styles.css', 'utf8');
          if (!demoStyles.startsWith('@import "tailwindcss";')) {
            demoStyles = `@import "tailwindcss";\n\n${demoStyles}`;
          }
          fs.writeFileSync('demo/styles.css', demoStyles);
          NODE

          cat > demo/ui.tsx <<'EOF'
          import {
            createContext,
            useContext,
            type ButtonHTMLAttributes,
            type HTMLAttributes,
            type SelectHTMLAttributes,
          } from "react";

          type ClassValue = string | false | null | undefined;

          function cn(...values: ClassValue[]) {
            return values.filter(Boolean).join(" ");
          }

          type ButtonProps = ButtonHTMLAttributes<HTMLButtonElement> & {
            size?: "default" | "sm";
            variant?: "default" | "secondary" | "outline" | "ghost";
          };

          export function Button({ className, size = "default", variant = "default", ...props }: ButtonProps) {
            return (
              <button
                className={cn(
                  "inline-flex cursor-pointer items-center justify-center rounded-md border font-semibold transition-colors disabled:pointer-events-none disabled:opacity-50",
                  size === "sm" ? "min-h-8 px-3 text-sm" : "min-h-9 px-4 text-sm",
                  variant === "default" && "border-[#0f766e] bg-[#0f766e] text-white hover:bg-[#115e59]",
                  variant === "secondary" && "border-[#d8e0ea] bg-[#eef2f6] text-[#172233] hover:bg-[#e2e8f0]",
                  variant === "outline" && "border-[#c9d3df] bg-white text-[#172233] hover:bg-[#f8fafc]",
                  variant === "ghost" && "border-transparent bg-transparent text-[#172233] hover:bg-[#eef2f6]",
                  className,
                )}
                {...props}
              />
            );
          }

          type BadgeProps = HTMLAttributes<HTMLSpanElement> & {
            variant?: "default" | "secondary" | "outline";
          };

          export function Badge({ className, variant = "default", ...props }: BadgeProps) {
            return (
              <span
                className={cn(
                  "inline-flex items-center rounded-full border px-2.5 py-1 text-xs font-semibold",
                  variant === "default" && "border-[#0f766e] bg-[#0f766e] text-white",
                  variant === "secondary" && "border-[#d8e0ea] bg-[#eef2f6] text-[#172233]",
                  variant === "outline" && "border-[#c9d3df] bg-transparent text-[#172233]",
                  className,
                )}
                {...props}
              />
            );
          }

          export function Card({ className, ...props }: HTMLAttributes<HTMLDivElement>) {
            return <div className={cn("grid rounded-lg border border-[#c6d2de] bg-white p-5 shadow-sm", className)} {...props} />;
          }

          export function CardHeader({ className, ...props }: HTMLAttributes<HTMLDivElement>) {
            return <div className={cn("grid gap-1.5", className)} {...props} />;
          }

          export function CardTitle({ className, ...props }: HTMLAttributes<HTMLHeadingElement>) {
            return <h3 className={cn("m-0 text-base font-bold text-[#101827]", className)} {...props} />;
          }

          export function CardContent({ className, ...props }: HTMLAttributes<HTMLDivElement>) {
            return <div className={cn("grid gap-3", className)} {...props} />;
          }

          type NativeSelectProps = Omit<SelectHTMLAttributes<HTMLSelectElement>, "size"> & {
            size?: "default" | "sm";
          };

          export function NativeSelect({ className, size = "default", ...props }: NativeSelectProps) {
            return (
              <select
                data-slot="native-select"
                className={cn(
                  "rounded-md border border-[#c9d3df] bg-white text-[#172233] outline-none focus:border-[#0f766e]",
                  size === "sm" ? "min-h-8 px-2 text-sm" : "min-h-9 px-3 text-sm",
                  className,
                )}
                {...props}
              />
            );
          }

          type TabsContextValue = {
            onValueChange?: (value: string) => void;
            value: string;
          };

          const TabsContext = createContext<TabsContextValue | null>(null);

          type TabsProps = HTMLAttributes<HTMLDivElement> & {
            onValueChange?: (value: string) => void;
            value: string;
          };

          export function Tabs({ value, onValueChange, ...props }: TabsProps) {
            return (
              <TabsContext.Provider value={{ value, onValueChange }}>
                <div {...props} />
              </TabsContext.Provider>
            );
          }

          export function TabsList({ className, ...props }: HTMLAttributes<HTMLDivElement>) {
            return <div role="tablist" className={cn("flex gap-2", className)} {...props} />;
          }

          type TabsTriggerProps = ButtonHTMLAttributes<HTMLButtonElement> & { value: string };

          export function TabsTrigger({ className, onClick, value, ...props }: TabsTriggerProps) {
            const context = useContext(TabsContext);
            if (!context) throw new Error("TabsTrigger must be rendered inside Tabs");
            const active = context.value === value;

            return (
              <button
                type="button"
                role="tab"
                aria-selected={active}
                data-state={active ? "active" : "inactive"}
                className={cn(
                  "min-h-9 rounded-md border px-3 text-sm font-semibold transition-colors",
                  active
                    ? "border-[#0f766e] bg-[#0f766e] text-white"
                    : "border-[#c9d3df] bg-white text-[#172233] hover:bg-[#f8fafc]",
                  className,
                )}
                onClick={(event) => {
                  onClick?.(event);
                  if (!event.defaultPrevented) context.onValueChange?.(value);
                }}
                {...props}
              />
            );
          }
          EOF

          bun install

          if grep -R --line-number --exclude=CHANGELOG.md '@moritzbrantner/ui' package.json bun.lock src demo docs README.md scripts; then
            echo 'Active @moritzbrantner/ui references remain' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/decouple-ui.yml
          git add -A
          git commit -m 'refactor: decouple maps from ui package'
          git push origin HEAD:decouple-ui
