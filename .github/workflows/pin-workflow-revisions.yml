name: Pin workflow revisions

on:
  push:
    branches:
      - chore/repository-foundation-v1

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: Replace mutable workflow refs with selected immutable commits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '@workflow-standard-v1.3': '@3b15546083e66aeba487a2e653e3ffaacbfe7220 # workflow-standard-v1.3',
              '@workflow-standard-v1.2': '@458c85c1a58cac26a5ab978e12ab8e9a27d4e0ee # workflow-standard-v1.2',
              'actions/checkout@v7': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7',
              'oven-sh/setup-bun@v2': 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2',
              'actions/setup-node@v6': 'actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6',
              'actions/cache@v5': 'actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5',
              'actions/configure-pages@v6': 'actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6',
              'actions/upload-pages-artifact@v5': 'actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5',
              'actions/deploy-pages@v5': 'actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5',
          }

          for path in Path('.github/workflows').glob('*.yml'):
              if path.name == 'pin-workflow-revisions.yml':
                  continue
              text = path.read_text()
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)
          PY
          git rm .github/workflows/pin-workflow-revisions.yml
          git add .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: pin existing workflow revisions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
