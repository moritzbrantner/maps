name: Retained browser runtime acceptance
on:
  push:
    branches: [diagnostics/maps-retained-runtime-20260923]
    paths: [.github/workflows/retained-runtime-acceptance.yml]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 30abc1d253d90a71c424f8d855d8fb7e45162611
          persist-credentials: false
      - run: mkdir -p evidence/retained-runtime
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35853859543
          name: build-artifact-1b67fda8f10f-9124783074ab-35853859543-1
          path: .
      - run: bunx playwright install --with-deps chromium
      - name: Observe device failures and dimensions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('e2e/maps-runtime-performance.spec.ts')
          s=p.read_text().replace('async function wheelBurst', '''test.beforeEach(async ({page}) => {
            page.on('console', m => { if(m.type() === 'error') console.log(m.text()); });
            page.on('pageerror', e => console.log('PAGE_ERROR', String(e)));
            await page.addInitScript(() => {
              const proto = (window as any).GPUAdapter?.prototype;
              if (!proto) return;
              const request = proto.requestDevice;
              proto.requestDevice = async function (...args: any[]) {
                const device = await request.apply(this, args);
                device.addEventListener('uncapturederror', (e: any) => console.error('GPU_VALIDATION', e.error.message));
                device.lost.then((info: any) => console.error('GPU_LOST', info.reason, info.message));
                return device;
              };
            });
          });
          async function wheelBurst''')
          p.write_text(s)
          p=Path('src/wgpu-base-map-wasm.ts')
          s=p.read_text().replace('    canvas.style.opacity = "0";\n    throw error;', '    canvas.style.opacity = "0";\n    console.error("WRAPPER_ERROR", String(error));\n    throw error;')
          p.write_text(s)
          PY
      - name: Observe GPU errors at native workload density
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: evidence/retained-runtime/report
        run: bun run test:browser --project=chromium e2e/maps-runtime-performance.spec.ts --grep 'controlled camera and hover on wgpu|host without React on wgpu' --output=evidence/retained-runtime/results > evidence/retained-runtime/browser.log 2>&1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maps-retained-runtime-diagnostic
          path: evidence/retained-runtime
          retention-days: 3
