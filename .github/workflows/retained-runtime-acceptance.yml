name: Retained browser runtime acceptance
on:
  push:
    branches: [diagnostics/maps-retained-runtime-20260923]
    paths: [.github/workflows/retained-runtime-acceptance.yml]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 30abc1d253d90a71c424f8d855d8fb7e45162611
          persist-credentials: false
      - run: mkdir -p evidence/retained-runtime
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35853859543
          name: build-artifact-1b67fda8f10f-9124783074ab-35853859543-1
          path: .
      - run: bunx playwright install --with-deps chromium
      - name: Observe exceptions without changing results
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('e2e/fixtures/native-map-probe.ts')
          s=p.read_text().replace('const result = originalRender.call(this, tiles, camera, frame);', '''let result: number;
          try { result = originalRender.call(this, tiles, camera, frame); }
          catch(error) { console.error('RENDER_EXCEPTION', String(error)); throw error; }''')
          p.write_text(s)
          p=Path('e2e/maps-runtime-performance.spec.ts')
          s=p.read_text().replace('async function wheelBurst', '''test.beforeEach(async ({page}) => {
            page.on('console', m => { if(m.type() === 'error') console.log(m.text()); });
            page.on('pageerror', e => console.log('PAGE_ERROR', String(e)));
          });
          test.afterEach(async ({page}, info) => {
            await info.attach('final-canvas-state',{body:JSON.stringify(await page.locator('canvas').evaluateAll(els => els.map(el => ({html:el.outerHTML,opacity:getComputedStyle(el).opacity,visibility:getComputedStyle(el).visibility}))),null,2),contentType:'application/json'});
          });
          async function wheelBurst''')
          p.write_text(s)
          PY
      - name: Observe native geometry and presentation
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: evidence/retained-runtime/report
        run: bun run test:browser --project=chromium e2e/maps-runtime-performance.spec.ts --output=evidence/retained-runtime/results > evidence/retained-runtime/browser.log 2>&1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maps-retained-runtime-diagnostic
          path: evidence/retained-runtime
          retention-days: 3
