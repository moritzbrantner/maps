name: Format renderer showcase once

on:
  push:
    branches:
      - feat/maps-canvas-renderer-showcase

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: feat/maps-canvas-renderer-showcase
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx oxfmt demo/RendererComparison.tsx demo/ShowcaseShell.tsx
      - run: rm .github/workflows/format-renderer-showcase-once.yml
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add demo/RendererComparison.tsx demo/ShowcaseShell.tsx .github/workflows/format-renderer-showcase-once.yml
          git commit -m "style: format renderer showcase"
          git push origin HEAD:feat/maps-canvas-renderer-showcase
