name: Refresh PR 92 MapLibre lockfile

on:
  push:
    branches:
      - feat/maps-independent-runtime

permissions:
  contents: write
  packages: read

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: feat/maps-independent-runtime
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Refresh lockfile and packaged styles
        env:
          GH_PACKAGES_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          bun install
          bun run build:styles
          bun run verify:audit
          node ./scripts/verify-package-styles.mjs .
          wc -c maplibre.css styles.css styles.full.css

      - name: Commit generated dependency artifacts
        run: |
          if git diff --quiet -- bun.lock maplibre.css styles.css styles.full.css; then
            echo "Dependency artifacts are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock maplibre.css styles.css styles.full.css
          git commit -m "Refresh MapLibre fallback package artifacts"
          git push origin HEAD:feat/maps-independent-runtime
