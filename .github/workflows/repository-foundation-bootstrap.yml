name: Repository foundation bootstrap

on:
  push:
    branches:
      - chore/repository-foundation-v1

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set up tooling runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Check out pinned foundation tools
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/moritzbrantner/coding-tooling.git "$RUNNER_TEMP/coding-tooling"
          git -C "$RUNNER_TEMP/coding-tooling" checkout --detach 14f3174a7fccb17b979e951ca8d59b1e544f1f74
          git clone --filter=blob:none https://github.com/moritzbrantner/coding-agent-conventions.git "$RUNNER_TEMP/coding-agent-conventions"
          git -C "$RUNNER_TEMP/coding-agent-conventions" checkout --detach 67977da6df48b2f4b15190e443f8e59ceaa0ef9a
          (cd "$RUNNER_TEMP/coding-tooling" && bun install --frozen-lockfile)

      - name: Apply detected repository foundation
        shell: bash
        run: |
          set -euo pipefail
          bun "$RUNNER_TEMP/coding-tooling/src/cli.ts" bootstrap apply \
            --conventions-root "$RUNNER_TEMP/coding-agent-conventions" \
            --json | tee "$RUNNER_TEMP/repository-foundation.json"

      - name: Commit generated foundation and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repository-foundation-bootstrap.yml
          git add .coding-tooling.json conventions.json conventions.lock.json .conventions
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: install repository foundation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
