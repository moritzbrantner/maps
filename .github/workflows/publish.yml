name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm. Leave unchecked to run the full release validation and `npm publish --dry-run` only."
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    name: Publish npm Package
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: moritzbrantner/reusable-workflows/.github/workflows/package-publish.yml@3b15546083e66aeba487a2e653e3ffaacbfe7220 # workflow-standard-v1.3
    with:
      package_manager: npm
      publish_enabled: true
      # A tag push publishes. A manual run is a dry run unless `publish` is checked,
      # so the workflow can be verified end to end without releasing a version.
      dry_run: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
      node_version: lts/*
      bun_version: latest
      cache_bun: true
      cache_node: false
      bun_cache_dependency_path: bun.lock
      install_command: |
        bun install --frozen-lockfile
        rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
        cargo install wasm-bindgen-cli --version 0.2.129 --locked
        bunx playwright install --with-deps chromium
      validate_command: bun run verify:release
      npm_scope: "@moritzbrantner"
      npm_access: public
      artifact_paths: benchmark-results
      upload_artifacts_on: always
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
