name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    name: Publish npm Package
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: moritzbrantner/reusable-workflows/.github/workflows/package-publish.yml@workflow-standard-v1.2
    with:
      package_manager: npm
      publish_enabled: true
      node_version: "24"
      bun_version: "1.3.14"
      cache_bun: true
      cache_node: false
      bun_cache_dependency_path: bun.lock
      install_command: |
        bun install --frozen-lockfile
        rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
        cargo install wasm-bindgen-cli --version 0.2.128 --locked
        bunx playwright install --with-deps chromium
      validate_command: bun run verify:release
      npm_scope: "@moritzbrantner"
      npm_access: public
      artifact_paths: benchmark-results
      upload_artifacts_on: always
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
