name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Superseded commits on the same PR must not occupy the runner queue.
concurrency:
  group: maps-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Validation scope
    runs-on: ubuntu-24.04
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
      security: ${{ steps.scope.outputs.security }}
      allow-skipped: ${{ steps.scope.outputs.allow-skipped }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - id: scope
        name: Preserve conditional validation policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: python
        run: |
          import fnmatch
          import json
          import os
          import subprocess

          event = os.environ["EVENT_NAME"]
          browser = security = event == "workflow_dispatch"
          if not browser:
              revision = [os.environ["BASE_SHA"], os.environ["HEAD_SHA"]]
              if event == "pull_request":
                  revision = ["...".join(revision)]
              paths = subprocess.check_output([
                  "git", "diff", "--no-renames", "--name-only", "-z", *revision
              ]).decode().split("\0")
              browser_patterns = [
                  "src/**", "crates/**", "demo/**", "e2e/**", "public/**", "scripts/**",
                  "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "package.json", "bun.lock",
                  "index.html", "playwright.config.*", "tsconfig*.json", "vite.config.*",
                  ".github/workflows/browser.yml", ".github/workflows/ci.yml",
              ]
              browser = any(fnmatch.fnmatchcase(path, pattern) for path in paths for pattern in browser_patterns)
              security = event == "pull_request" and any(path in [
                  "package.json", "bun.lock", ".github/workflows/security.yml", ".github/workflows/ci.yml"
              ] for path in paths)
          skipped = []
          if event != "workflow_dispatch":
              skipped.extend([
                  "wasm-package-validation", "package-validation",
                  "browser-smoke", "runtime-evidence",
              ])
          if not browser:
              skipped.extend(["build-package", "browser-validation"])
          if not security:
              skipped.append("dependency-audit")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"browser={str(browser).lower()}", file=output)
              print(f"security={str(security).lower()}", file=output)
              print(f"allow-skipped={json.dumps(skipped)}", file=output)

  fast-validation:
    name: Fast Validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@3b15546083e66aeba487a2e653e3ffaacbfe7220 # workflow-standard-v1.3
    with:
      node_version: lts/*
      bun_version: latest
      cache_bun: false
      bun_cache_dependency_path: bun.lock
      format_command: bun run format:check
      lint_command: bun run lint
      typecheck_command: bun run check-types
      unit_test_command: bun run test

  rust-validation:
    name: Rust Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.2
          enable-kvm: false
      - name: Validate Rust and WASM tooling in Nix shell
        run: |
          nix develop --command bash -lc '
            set -euo pipefail
            bun --version
            wasm-bindgen --version
            wasm-opt --version
            cargo --version
            node --test scripts/install-wasm-bindgen-ci.test.ts
            bun run verify:rust
          '

  git-install-validation:
    name: Git Install Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.2
          enable-kvm: false
      # Cache downloaded crate inputs, never this candidate's prepared package or target.
      - name: Cache Cargo dependency sources
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-maps-git-cargo-${{ hashFiles('flake.lock', 'rust-toolchain.toml', 'Cargo.lock') }}
      - name: Prove clean Git source installation in Nix shell
        run: |
          nix develop --command bash -lc '
            set -euo pipefail
            # This checkout only hosts the verifier and reads the MapLibre source CSS.
            # The separate verifier consumer still runs all real prepare scripts.
            bun install --frozen-lockfile --ignore-scripts
            bun run verify:git-install
          '

  build-package:
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' }}
    name: Build or reuse browser package
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@5e9fe1ab1fd5c8d91900a621bf8daabf879012a7
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: ${{ github.event_name == 'workflow_dispatch' && 'maps-browser-package-v2' || 'maps-browser-runtime-v1' }}
      rust_toolchain: stable
      rust_targets: wasm32-unknown-unknown
      bun_version: latest
      node_version: lts/*
      cache_bun: false
      bun_cache_dependency_path: bun.lock
      use_environment_v1: false
      setup_command: |
        bun install --frozen-lockfile
        bash scripts/install-wasm-bindgen-ci.sh
      build_command: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          bun run build:package
        else
          bun run build:wasm
        fi
        # Build the locked Git dependencies once, not in every browser consumer.
        rm -rf ci-browser-dependencies
        mkdir -p ci-browser-dependencies
        cp -R node_modules/@moritzbrantner/ui/dist ci-browser-dependencies/ui
        cp -R node_modules/@moritzbrantner/timeline-editor/dist ci-browser-dependencies/timeline-editor
        cp -R node_modules/@moenarch/editor-core/dist ci-browser-dependencies/editor-core
      artifact_paths: |
        public/wasm
        ci-browser-dependencies
        ${{ github.event_name == 'workflow_dispatch' && 'dist' || '' }}
      reuse_across_runs: true
      artifact_retention_days: 7

  wasm-package-validation:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: WASM Package Validation
    needs:
      - fast-validation
      - rust-validation
      - build-package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.build-package.outputs.source_sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Consume verified browser package
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@5e9fe1ab1fd5c8d91900a621bf8daabf879012a7
        with:
          producer_run_id: ${{ needs.build-package.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-package.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
          source_sha: ${{ needs.build-package.outputs.source_sha }}
          artifact_key: ${{ needs.build-package.outputs.artifact_key }}
          identity_digest: ${{ needs.build-package.outputs.identity_digest }}
          destination_path: .artifacts/maps-browser-package
          github_token: ${{ github.token }}
      - name: Stage packed package
        run: |
          rm -rf dist
          cp -R .artifacts/maps-browser-package/dist ./dist
      - name: Verify packed WASM runtime
        run: |
          node ./scripts/verify-wasm-package.mjs
          bun run verify:engine-camera:prepared

  package-validation:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Package Validation
    needs:
      - fast-validation
      - rust-validation
      - build-package
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@5e9fe1ab1fd5c8d91900a621bf8daabf879012a7
    with:
      node_version: lts/*
      bun_version: latest
      bun_cache_dependency_path: bun.lock
      prebuilt_artifact_run_id: ${{ needs.build-package.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-package.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-package.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-package.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-package.outputs.identity_digest }}
      prebuilt_artifact_destination: .artifacts/maps-browser-package
      package_check_command: |
        rm -rf dist
        cp -R .artifacts/maps-browser-package/dist ./dist
        bun run verify:api-surface
        bun run verify:entry-bundles
        bun run verify:package-consumer
        bun run verify:package-size
        bun run pack:dry

  browser-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Browser Smoke
    needs:
      - fast-validation
      - rust-validation
      - build-package
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@5e9fe1ab1fd5c8d91900a621bf8daabf879012a7
    with:
      node_version: lts/*
      bun_version: latest
      cache_bun: false
      bun_cache_dependency_path: bun.lock
      install_command: bun install --frozen-lockfile --ignore-scripts
      prebuilt_artifact_run_id: ${{ needs.build-package.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-package.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-package.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-package.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-package.outputs.identity_digest }}
      prebuilt_artifact_destination: .artifacts/maps-browser-package
      e2e_command: |
        rm -rf public/wasm
        mkdir -p public
        cp -R .artifacts/maps-browser-package/public/wasm public/wasm
        rm -rf node_modules/@moritzbrantner/ui/dist node_modules/@moritzbrantner/timeline-editor/dist node_modules/@moenarch/editor-core/dist
        cp -R .artifacts/maps-browser-package/ci-browser-dependencies/ui node_modules/@moritzbrantner/ui/dist
        cp -R .artifacts/maps-browser-package/ci-browser-dependencies/timeline-editor node_modules/@moritzbrantner/timeline-editor/dist
        cp -R .artifacts/maps-browser-package/ci-browser-dependencies/editor-core node_modules/@moenarch/editor-core/dist
        bun run test:browser:smoke
      install_playwright: true
      install_playwright_browsers: chromium
      concurrency_group: maps-${{ github.ref }}-browser-smoke
      artifact_name_suffix: -smoke
      artifact_paths: |
        playwright-report
        test-results
      upload_artifacts_on: failure

  runtime-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Runtime Evidence
    needs:
      - fast-validation
      - rust-validation
      - build-package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.build-package.outputs.source_sha }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Consume verified browser package
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@5e9fe1ab1fd5c8d91900a621bf8daabf879012a7
        with:
          producer_run_id: ${{ needs.build-package.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-package.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
          source_sha: ${{ needs.build-package.outputs.source_sha }}
          artifact_key: ${{ needs.build-package.outputs.artifact_key }}
          identity_digest: ${{ needs.build-package.outputs.identity_digest }}
          destination_path: .artifacts/maps-browser-package
          github_token: ${{ github.token }}
      - name: Stage packed package
        run: |
          rm -rf dist
          cp -R .artifacts/maps-browser-package/dist ./dist
      - name: Install pinned runtime-profiler
        run: cargo install --git https://github.com/moritzbrantner/runtime-profiler.git --rev 5fa0e1b652e95003ccad11f32a4df67b96eac6f8 --locked runtime-profiler
      - name: Install pinned Moonlight runtime evaluator
        run: cargo install --git https://github.com/moritzbrantner/moonlight.git --rev b5803275fb62b1fee659c42a31209adca6e3da04 --locked moonlight-cli --bin moonlight-runtime-profile
      - name: Capture and evaluate runtime evidence
        run: bun run verify:engine-runtime-evidence
      - name: Preserve runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maps-milestone-b-runtime-evidence
          path: .runtime-profiler/maps-camera-world-pan-v1
          if-no-files-found: warn
          retention-days: 7

  browser-validation:
    needs:
      - changes
      - build-package
    if: ${{ needs.changes.outputs.browser == 'true' }}
    name: Full Browser Validation (${{ matrix.partition }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # These three slower files accounted for 363s; the complement for 365s.
          # New/unrecognized files automatically run in the complement.
          - partition: demo
            selection: --grep=(maps-demo|maps-runtime|maps-engine-tiles)\.spec\.ts
          - partition: engine
            selection: --grep-invert=(maps-demo|maps-runtime|maps-engine-tiles)\.spec\.ts
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@5e9fe1ab1fd5c8d91900a621bf8daabf879012a7
    with:
      node_version: lts/*
      bun_version: latest
      cache_bun: false
      bun_cache_dependency_path: bun.lock
      install_command: bun install --frozen-lockfile --ignore-scripts
      prebuilt_artifact_run_id: ${{ needs.build-package.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-package.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-package.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-package.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-package.outputs.identity_digest }}
      prebuilt_artifact_destination: .artifacts/maps-browser-package
      e2e_command: |
        rm -rf public/wasm
        mkdir -p public
        cp -R .artifacts/maps-browser-package/public/wasm public/wasm
        rm -rf node_modules/@moritzbrantner/ui/dist node_modules/@moritzbrantner/timeline-editor/dist node_modules/@moenarch/editor-core/dist
        cp -R .artifacts/maps-browser-package/ci-browser-dependencies/ui node_modules/@moritzbrantner/ui/dist
        cp -R .artifacts/maps-browser-package/ci-browser-dependencies/timeline-editor node_modules/@moritzbrantner/timeline-editor/dist
        cp -R .artifacts/maps-browser-package/ci-browser-dependencies/editor-core node_modules/@moenarch/editor-core/dist
        bun run test:browser -- --project=chromium --workers=1 '${{ matrix.selection }}'
      install_playwright: true
      install_playwright_browsers: chromium
      # One software GPU worker per runner; shards do not contend for the same CPU.
      concurrency_group: maps-${{ github.ref }}-browser-full-${{ matrix.partition }}
      artifact_name_suffix: -full-${{ matrix.partition }}
      artifact_paths: |
        playwright-report
        test-results
      upload_artifacts_on: failure

  dependency-audit:
    needs: changes
    if: ${{ needs.changes.outputs.security == 'true' }}
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run verify:audit

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs:
      - changes
      - fast-validation
      - rust-validation
      - git-install-validation
      - build-package
      - wasm-package-validation
      - package-validation
      - browser-smoke
      - runtime-evidence
      - browser-validation
      - dependency-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["changes", "fast-validation", "rust-validation", "git-install-validation", "build-package", "wasm-package-validation", "package-validation", "browser-smoke", "runtime-evidence", "browser-validation", "dependency-audit"]'
          allow-skipped: ${{ needs.changes.outputs.allow-skipped || '[]' }}
