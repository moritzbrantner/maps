name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  fast-validation:
    name: Fast Validation
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1
    permissions:
      contents: read
      packages: read
    with:
      bun_version: "1.3.14"
      lint_command: bun run lint
      typecheck_command: bun run check-types
      build_command: bun run build
      unit_test_command: bun run test
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  integration-validation:
    name: Integration Validation
    needs: fast-validation
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@workflow-standard-v1
    permissions:
      contents: read
      packages: read
    with:
      bun_version: "1.3.14"
      pre_command: bun run build
      package_check_command: bun run verify:api-surface && bun run verify:entry-bundles && bun run verify:package-consumer && bun run pack:dry
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  browser-smoke:
    name: Browser Smoke
    needs: fast-validation
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@workflow-standard-v1
    permissions:
      contents: read
      packages: read
    with:
      bun_version: "1.3.14"
      pre_command: bunx playwright install --with-deps chromium
      e2e_command: bun run test:browser -- --grep @smoke --project=chromium
      install_playwright: false
      upload_artifacts_on: failure
      artifact_name_suffix: -smoke
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
