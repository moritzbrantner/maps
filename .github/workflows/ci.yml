name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  changes:
    name: Validation scope
    runs-on: ubuntu-24.04
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
      security: ${{ steps.scope.outputs.security }}
      allow-skipped: ${{ steps.scope.outputs.allow-skipped }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - id: scope
        name: Preserve conditional validation policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: python
        run: |
          import fnmatch
          import json
          import os
          import subprocess

          event = os.environ["EVENT_NAME"]
          browser = security = event == "workflow_dispatch"
          if not browser:
              revision = [os.environ["BASE_SHA"], os.environ["HEAD_SHA"]]
              if event == "pull_request":
                  revision = ["...".join(revision)]
              paths = subprocess.check_output([
                  "git", "diff", "--no-renames", "--name-only", "-z", *revision
              ]).decode().split("\0")
              browser_patterns = [
                  "src/**", "crates/**", "demo/**", "e2e/**", "public/**", "scripts/**",
                  "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "package.json", "bun.lock",
                  "index.html", "playwright.config.*", "tsconfig*.json", "vite.config.*",
                  ".github/workflows/browser.yml", ".github/workflows/ci.yml",
              ]
              browser = any(fnmatch.fnmatchcase(path, pattern) for path in paths for pattern in browser_patterns)
              security = event == "pull_request" and any(path in [
                  "package.json", "bun.lock", ".github/workflows/security.yml", ".github/workflows/ci.yml"
              ] for path in paths)
          skipped = []
          if event != "workflow_dispatch":
              skipped.extend([
                  "build-package", "wasm-package-validation", "package-validation",
                  "browser-smoke", "runtime-evidence",
              ])
          if not browser:
              skipped.append("browser-validation")
          if not security:
              skipped.append("dependency-audit")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"browser={str(browser).lower()}", file=output)
              print(f"security={str(security).lower()}", file=output)
              print(f"allow-skipped={json.dumps(skipped)}", file=output)

  fast-validation:
    name: Fast Validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@3b15546083e66aeba487a2e653e3ffaacbfe7220 # workflow-standard-v1.3
    with:
      node_version: "24"
      bun_version: "1.3.14"
      bun_cache_dependency_path: bun.lock
      format_command: bun run format:check
      lint_command: bun run lint
      typecheck_command: bun run check-types
      unit_test_command: bun run test

  rust-validation:
    name: Rust Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.2
          enable-kvm: false
      - name: Validate Rust and WASM tooling in Nix shell
        run: |
          nix develop --command bash -lc '
            set -euo pipefail
            bun --version
            wasm-bindgen --version
            wasm-opt --version
            cargo --version
            node --test scripts/install-wasm-bindgen-ci.test.mjs
            bun run verify:rust
            bun run build:wasm
            bun install --frozen-lockfile
            bun run verify:git-install
          '

  build-package:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Build or reuse browser package
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@5e9fe1ab1fd5c8d91900a621bf8daabf879012a7
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: maps-browser-package-v1
      rust_toolchain: "1.99.0"
      rust_targets: wasm32-unknown-unknown
      bun_version: "1.3.14"
      node_version: "24"
      cache_bun: true
      bun_cache_dependency_path: bun.lock
      use_environment_v1: false
      setup_command: |
        bun install --frozen-lockfile
        bash scripts/install-wasm-bindgen-ci.sh
      build_command: |
        bun run build:package
        rm -rf public/wasm
        mkdir -p public/wasm
        cp dist/wasm/maps_wasm.js dist/wasm/maps_wasm_bg.wasm public/wasm/
      artifact_paths: |
        dist
        public/wasm
      reuse_across_runs: true
      artifact_retention_days: 7

  wasm-package-validation:
    name: WASM Package Validation
    needs:
      - fast-validation
      - rust-validation
      - build-package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.build-package.outputs.source_sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Consume verified browser package
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@5e9fe1ab1fd5c8d91900a621bf8daabf879012a7
        with:
          producer_run_id: ${{ needs.build-package.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-package.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
          source_sha: ${{ needs.build-package.outputs.source_sha }}
          artifact_key: ${{ needs.build-package.outputs.artifact_key }}
          identity_digest: ${{ needs.build-package.outputs.identity_digest }}
          destination_path: .artifacts/maps-browser-package
          github_token: ${{ github.token }}
      - name: Stage packed package
        run: |
          rm -rf dist
          cp -R .artifacts/maps-browser-package/dist ./dist
      - name: Verify packed WASM runtime
        run: |
          node ./scripts/verify-wasm-package.mjs
          bun run verify:engine-camera:prepared

  package-validation:
    name: Package Validation
    needs:
      - fast-validation
      - rust-validation
      - build-package
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@5e9fe1ab1fd5c8d91900a621bf8daabf879012a7
    with:
      node_version: "24"
      bun_version: 1.3.14
      bun_cache_dependency_path: bun.lock
      prebuilt_artifact_run_id: ${{ needs.build-package.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-package.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-package.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-package.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-package.outputs.identity_digest }}
      prebuilt_artifact_destination: .artifacts/maps-browser-package
      package_check_command: |
        rm -rf dist
        cp -R .artifacts/maps-browser-package/dist ./dist
        bun run verify:api-surface
        bun run verify:entry-bundles
        bun run verify:package-consumer
        bun run verify:package-size
        bun run pack:dry

  browser-smoke:
    name: Browser Smoke
    needs:
      - fast-validation
      - rust-validation
      - build-package
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@5e9fe1ab1fd5c8d91900a621bf8daabf879012a7
    with:
      node_version: "24"
      bun_version: 1.3.14
      bun_cache_dependency_path: bun.lock
      prebuilt_artifact_run_id: ${{ needs.build-package.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-package.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-package.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-package.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-package.outputs.identity_digest }}
      prebuilt_artifact_destination: .artifacts/maps-browser-package
      e2e_command: |
        rm -rf public/wasm
        mkdir -p public
        cp -R .artifacts/maps-browser-package/public/wasm public/wasm
        bun run test:browser:smoke
      install_playwright: true
      install_playwright_browsers: chromium
      artifact_paths: |
        playwright-report
        test-results
      upload_artifacts_on: failure

  runtime-evidence:
    name: Runtime Evidence
    needs:
      - fast-validation
      - rust-validation
      - build-package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.build-package.outputs.source_sha }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Consume verified browser package
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@5e9fe1ab1fd5c8d91900a621bf8daabf879012a7
        with:
          producer_run_id: ${{ needs.build-package.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-package.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
          source_sha: ${{ needs.build-package.outputs.source_sha }}
          artifact_key: ${{ needs.build-package.outputs.artifact_key }}
          identity_digest: ${{ needs.build-package.outputs.identity_digest }}
          destination_path: .artifacts/maps-browser-package
          github_token: ${{ github.token }}
      - name: Stage packed package
        run: |
          rm -rf dist
          cp -R .artifacts/maps-browser-package/dist ./dist
      - name: Install pinned runtime-profiler
        run: cargo install --git https://github.com/moritzbrantner/runtime-profiler.git --rev 573ff4a6c29e281d4e42f7de90ecb4f173a4ad9f --locked runtime-profiler
      - name: Install pinned Moonlight runtime evaluator
        run: cargo install --git https://github.com/moritzbrantner/moonlight.git --rev b5803275fb62b1fee659c42a31209adca6e3da04 --locked moonlight-cli --bin moonlight-runtime-profile
      - name: Capture and evaluate runtime evidence
        run: bun run verify:engine-runtime-evidence
      - name: Preserve runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maps-milestone-b-runtime-evidence
          path: .runtime-profiler/maps-camera-world-pan-v1
          if-no-files-found: warn
          retention-days: 7

  browser-validation:
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' }}
    name: Full Browser Validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@3b15546083e66aeba487a2e653e3ffaacbfe7220 # workflow-standard-v1.3
    with:
      node_version: "24"
      bun_version: "1.3.14"
      bun_cache_dependency_path: bun.lock
      install_command: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          expected_head="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=1 origin "+refs/pull/${{ github.event.number }}/head:refs/remotes/origin/pr-head"
          git checkout --detach refs/remotes/origin/pr-head
          actual_head="$(git rev-parse HEAD)"
          if [ "$actual_head" != "$expected_head" ]; then
            echo "::error::Full Browser Tests checked out $actual_head instead of PR head $expected_head."
            exit 1
          fi
        fi
        bun install --frozen-lockfile
      pre_command: |
        bunx playwright install --with-deps chromium
        rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
        rustup default 1.99.0
        source scripts/install-wasm-bindgen-ci.sh
        bun run build:wasm
        rm -rf public/wasm
        mkdir -p public/wasm
        cp dist/wasm/maps_wasm.js dist/wasm/maps_wasm_bg.wasm public/wasm/
      e2e_command: bun run test:browser -- --project=chromium
      install_playwright: false
      artifact_paths: |
        playwright-report
        test-results
      upload_artifacts_on: failure

  dependency-audit:
    needs: changes
    if: ${{ needs.changes.outputs.security == 'true' }}
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run verify:audit

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs:
      - changes
      - fast-validation
      - rust-validation
      - build-package
      - wasm-package-validation
      - package-validation
      - browser-smoke
      - runtime-evidence
      - browser-validation
      - dependency-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["changes", "fast-validation", "rust-validation", "build-package", "wasm-package-validation", "package-validation", "browser-smoke", "runtime-evidence", "browser-validation", "dependency-audit"]'
          allow-skipped: ${{ needs.changes.outputs.allow-skipped || '[]' }}
