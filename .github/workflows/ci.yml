name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  fast-validation:
    name: Fast Validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1.3
    with:
      node_version: "24"
      bun_version: "1.3.14"
      bun_cache_dependency_path: bun.lock
      format_command: bun run format:check
      lint_command: bun run lint
      typecheck_command: bun run check-types
      unit_test_command: bun run test
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  rust-validation:
    name: Rust Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --lib --tests --locked
      - name: Check WASM crate
        run: cargo check -p maps-wasm --target wasm32-unknown-unknown --locked

  build-package:
    name: Build or reuse browser package
    needs:
      - fast-validation
      - rust-validation
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@5e9fe1ab1fd5c8d91900a621bf8daabf879012a7
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: maps-browser-package-v1
      rust_toolchain: "1.98.1"
      rust_targets: wasm32-unknown-unknown
      bun_version: "1.3.14"
      node_version: "24"
      cache_bun: true
      bun_cache_dependency_path: bun.lock
      use_environment_v1: false
      setup_command: |
        bun install --frozen-lockfile
        cargo install wasm-bindgen-cli --version 0.2.128 --locked
      build_command: |
        bun run build:package
        rm -rf public/wasm
        mkdir -p public/wasm
        cp dist/wasm/maps_wasm.js dist/wasm/maps_wasm_bg.wasm public/wasm/
      artifact_paths: |
        dist
        public/wasm
      reuse_across_runs: true
      artifact_retention_days: 7
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  wasm-package-validation:
    name: WASM Package Validation
    needs: build-package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.build-package.outputs.source_sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: "24"
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Consume verified browser package
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@5e9fe1ab1fd5c8d91900a621bf8daabf879012a7
        with:
          producer_run_id: ${{ needs.build-package.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-package.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
          source_sha: ${{ needs.build-package.outputs.source_sha }}
          artifact_key: ${{ needs.build-package.outputs.artifact_key }}
          identity_digest: ${{ needs.build-package.outputs.identity_digest }}
          destination_path: .artifacts/maps-browser-package
          github_token: ${{ github.token }}
      - name: Stage packed package
        run: |
          rm -rf dist
          cp -R .artifacts/maps-browser-package/dist ./dist
      - name: Verify packed WASM runtime
        run: |
          node ./scripts/verify-wasm-package.mjs
          bun run verify:engine-camera:prepared

  package-validation:
    name: Package Validation
    needs: build-package
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@5e9fe1ab1fd5c8d91900a621bf8daabf879012a7
    with:
      node_version: "24"
      bun_version: 1.3.14
      bun_cache_dependency_path: bun.lock
      prebuilt_artifact_run_id: ${{ needs.build-package.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-package.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-package.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-package.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-package.outputs.identity_digest }}
      prebuilt_artifact_destination: .artifacts/maps-browser-package
      package_check_command: |
        rm -rf dist
        cp -R .artifacts/maps-browser-package/dist ./dist
        bun run verify:api-surface
        bun run verify:entry-bundles
        bun run verify:package-consumer
        bun run verify:package-size
        bun run pack:dry
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  browser-smoke:
    name: Browser Smoke
    needs: build-package
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@5e9fe1ab1fd5c8d91900a621bf8daabf879012a7
    with:
      node_version: "24"
      bun_version: 1.3.14
      bun_cache_dependency_path: bun.lock
      prebuilt_artifact_run_id: ${{ needs.build-package.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-package.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-package.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-package.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-package.outputs.identity_digest }}
      prebuilt_artifact_destination: .artifacts/maps-browser-package
      e2e_command: |
        rm -rf public/wasm
        mkdir -p public
        cp -R .artifacts/maps-browser-package/public/wasm public/wasm
        bun run test:browser:smoke
      install_playwright: true
      install_playwright_browsers: chromium
      artifact_paths: |
        playwright-report
        test-results
      upload_artifacts_on: failure
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  runtime-evidence:
    name: Runtime Evidence
    needs: build-package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.build-package.outputs.source_sha }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: "24"
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Consume verified browser package
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@5e9fe1ab1fd5c8d91900a621bf8daabf879012a7
        with:
          producer_run_id: ${{ needs.build-package.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-package.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
          source_sha: ${{ needs.build-package.outputs.source_sha }}
          artifact_key: ${{ needs.build-package.outputs.artifact_key }}
          identity_digest: ${{ needs.build-package.outputs.identity_digest }}
          destination_path: .artifacts/maps-browser-package
          github_token: ${{ github.token }}
      - name: Stage packed package
        run: |
          rm -rf dist
          cp -R .artifacts/maps-browser-package/dist ./dist
      - name: Install pinned runtime-profiler
        run: cargo install --git https://github.com/moritzbrantner/runtime-profiler.git --rev 573ff4a6c29e281d4e42f7de90ecb4f173a4ad9f --locked runtime-profiler
      - name: Install pinned Moonlight runtime evaluator
        run: cargo install --git https://github.com/moritzbrantner/moonlight.git --rev b5803275fb62b1fee659c42a31209adca6e3da04 --locked moonlight-cli --bin moonlight-runtime-profile
      - name: Capture and evaluate runtime evidence
        run: bun run verify:engine-runtime-evidence
      - name: Preserve runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: maps-milestone-b-runtime-evidence
          path: .runtime-profiler/maps-camera-world-pan-v1
          if-no-files-found: warn
          retention-days: 7
