name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  fast-validation:
    name: Fast Validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1.2
    with:
      node_version: "24"
      bun_version: "1.3.14"
      bun_cache_dependency_path: bun.lock
      format_command: bun run format:check
      lint_command: bun run lint
      typecheck_command: bun run check-types
      build_command: bun run build
      unit_test_command: bun run test
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  package-validation:
    name: Package Validation
    needs: fast-validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@workflow-standard-v1.3
    with:
      node_version: "24"
      bun_version: "1.3.14"
      bun_cache_dependency_path: bun.lock
      package_check_command: |
        bun run verify:api-surface
        bun run build
        bun run verify:entry-bundles
        bun run verify:package-consumer
        bun run verify:package-size
        bun run pack:dry
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  browser-smoke:
    name: Browser Smoke
    needs: fast-validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@workflow-standard-v1.3
    with:
      node_version: "24"
      bun_version: "1.3.14"
      bun_cache_dependency_path: bun.lock
      pre_command: bunx playwright install --with-deps chromium
      e2e_command: bun run test:browser:smoke
      install_playwright: false
      artifact_paths: |
        playwright-report
        test-results
      upload_artifacts_on: failure
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
