name: Remove viz-engine dependency

on:
  push:
    branches:
      - feat/maps-native-runtime-final

permissions:
  contents: write

jobs:
  remove-dependency:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: feat/maps-native-runtime-final
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Replace viz-engine test vocabulary
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/map-kinds.test.tsx")
          text = path.read_text()
          old_import = '''import type {
            VizDataset,
            VizEngine,
            VizGeoJsonFeatureCollection,
            VizLayer,
            VizRenderLayer,
          } from "@moritzbrantner/viz-engine/core";
          '''
          if old_import not in text:
              raise SystemExit("viz-engine test import did not match")
          text = text.replace(old_import, "")
          anchor = '''afterEach(() => {
            flatMock.reset();
            vi.unstubAllGlobals();
          });
          
          '''
          replacement = anchor + '''type MockDataset =
            | { kind: "geo-points"; points: readonly MapPoint[] }
            | { flows: readonly MapFlow[]; kind: "geo-flows" }
            | { featureCollection: GeoJsonMapSource; kind: "geojson" };
          
          type MockLayer = {
            datasetId: string;
            kind: "geo-clusters" | "geo-flows" | "geo-heat" | "geo-points" | "geojson";
            [key: string]: unknown;
          };
          
          type MockRenderLayer = {
            kind: string;
            layerId: string;
            [key: string]: unknown;
          };
          
          '''
          if anchor not in text:
              raise SystemExit("mock type insertion anchor did not match")
          text = text.replace(anchor, replacement, 1)
          replacements = {
              "MockVizEngine": "MockCompatibilityEngine",
              "createMockVizEngine": "createMockCompatibilityEngine",
              "VizDataset": "MockDataset",
              "VizGeoJsonFeatureCollection": "GeoJsonMapSource",
              "VizLayer": "MockLayer",
              "VizRenderLayer": "MockRenderLayer",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          text = text.replace(
              '''type MockCompatibilityEngine = VizEngine & {
          ''',
              '''type MockCompatibilityEngine = {
          ''',
          )
          path.write_text(text)
          PY
      - name: Remove package dependency and refresh lock
        shell: bash
        run: |
          bun remove @moritzbrantner/viz-engine
          bun install --frozen-lockfile
      - name: Verify generic visualization dependency is gone
        shell: bash
        run: |
          if grep -R --line-number --exclude='verify-entry-bundles.mjs' --exclude='remove-viz-engine-once.yml' '@moritzbrantner/viz-engine' src docs package.json bun.lock; then
            echo 'viz-engine references remain outside the intentional forbidden-import guard' >&2
            exit 1
          fi
          rm .github/workflows/remove-viz-engine-once.yml
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/map-kinds.test.tsx package.json bun.lock .github/workflows/remove-viz-engine-once.yml
          git commit -m "refactor: remove viz-engine dependency"
          git push origin HEAD:feat/maps-native-runtime-final
