name: Focused WebGPU candidate acceptance
on:
  push:
    branches: [diagnostics/maps-perf-next-20260924]
    paths: [.github/workflows/focused-wgpu.yml]
permissions:
  contents: read
  packages: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b8dfd003ced39645854d0c44e9a9e491979b1586
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Build current candidate WASM
        run: |
          bun run build:wasm
          rm -rf public/wasm
          mkdir -p public/wasm
          cp dist/wasm/maps_wasm.js dist/wasm/maps_wasm_bg.wasm public/wasm/
      - run: bunx playwright install --with-deps chromium
      - name: Run real WebGPU renderer acceptance
        run: bun run test:browser -- --project=chromium e2e/maps-wgpu-stroke-runtime.spec.ts
