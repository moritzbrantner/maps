name: Maps runtime ownership audit
on:
  push:
    branches: [diagnostics/maps-camera-sync-20260923]
    paths: [.github/workflows/camera-sync-acceptance.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ea57e1d2258d3fb211b653b867e48d779b71ebee
          persist-credentials: false
      - name: Export source without credentials or dependencies
        run: |
          mkdir -p /tmp/maps-audit
          git archive HEAD -o /tmp/maps-audit/source.tar
          git rev-parse HEAD > /tmp/maps-audit/source-commit.txt
          curl --fail --location --max-time 30 'https://moritzbrantner.github.io/coding-tooling/analysis.json/?repo=moritzbrantner%2Fmaps&view=agent&envelope=1' > /tmp/maps-audit/analysis.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: maps-audit-source
          path: /tmp/maps-audit
          retention-days: 1
