name: Camera synchronization acceptance
on:
  push:
    branches: [diagnostics/maps-camera-sync-20260923]
    paths: [.github/workflows/camera-sync-acceptance.yml]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7ddeab6d2f8b2c886e3fe91520dfad7c8eee8043
          persist-credentials: false
      - name: Record candidate and fetch the negative-test baseline
        run: |
          git fetch --depth=1 origin 1b67fda8f10fee0aaeaf8cf5589ab9a6aca5181f
          mkdir -p evidence/camera-sync
          git rev-parse HEAD > evidence/camera-sync/source-commit.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Agent gate
        run: bun run verify:agent > evidence/camera-sync/agent.log 2>&1
      - name: Reuse unchanged Rust WASM from the exact base
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35853859543
          name: build-artifact-1b67fda8f10f-9124783074ab-35853859543-1
          path: .
      - run: bunx playwright install --with-deps chromium
      - name: Camera alignment, picking, actual pixels and retained geometry
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: evidence/camera-sync/after-report
        run: bun run test:browser --project=chromium e2e/maps-camera-presentation.spec.ts e2e/maps-overlay-retention.spec.ts --output=evidence/camera-sync/after-results > evidence/camera-sync/after.log 2>&1
      - name: Verify new browser regressions reject the original source
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: evidence/camera-sync/before-report
        run: |
          candidate=$(git rev-parse HEAD)
          git restore --source=1b67fda8f10fee0aaeaf8cf5589ab9a6aca5181f --worktree src
          set +e
          bun run test:browser --project=chromium e2e/maps-camera-presentation.spec.ts --output=evidence/camera-sync/before-results > evidence/camera-sync/before.log 2>&1
          result=$?
          set -e
          git restore --source="$candidate" --worktree src
          cat evidence/camera-sync/before.log
          test "$result" -eq 1
          grep -F 'expect(work.beforePaint)' evidence/camera-sync/before.log
      - name: Retain screenshots and work counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maps-camera-synchronization-evidence
          path: evidence/camera-sync
          retention-days: 7
