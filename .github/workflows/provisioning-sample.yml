name: Maps Provisioning Sample

# One independent sample of the issue #211 provisioning comparison. Only the
# manual Maps Provisioning Comparison workflow calls this; it is never required.
on:
  workflow_call:
    inputs:
      variant:
        description: ubuntu, nix or container
        required: true
        type: string
      cache_mode:
        description: cold (no persisted caches), prime (save caches) or warm (restore caches)
        required: true
        type: string
      sample:
        required: true
        type: string
      image:
        description: Content-addressed agent image id (sha256:...), only for the container variant
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  sample:
    name: "${{ inputs.variant }} ${{ inputs.cache_mode }} ${{ inputs.sample }}"
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      VARIANT: ${{ inputs.variant }}
      AGENT_IMAGE: ${{ inputs.image }}
      CACHE_KEY: maps-provisioning-${{ inputs.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the identical source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Conventional Rust setup
        if: inputs.variant == 'ubuntu'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Conventional Bun setup
        if: inputs.variant == 'ubuntu'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Conventional Node setup
        if: inputs.variant == 'ubuntu'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Conventional verified wasm-bindgen tool
        if: inputs.variant == 'ubuntu'
        run: bash scripts/install-wasm-bindgen-ci.sh

      - name: Install Nix
        if: inputs.variant == 'nix'
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.2
          enable-kvm: false

      - name: Download prebuilt agent image
        if: inputs.variant == 'container'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maps-agent-image
          path: ${{ runner.temp }}/agent-image
      - name: Load digest-verified agent image
        if: inputs.variant == 'container'
        run: |
          set -euo pipefail
          zstd --decompress --stdout "$RUNNER_TEMP/agent-image/agent-image.tar.zst" | docker load
          actual="$(docker image inspect --format '{{.Id}}' "$AGENT_IMAGE")"
          test "$actual" = "$AGENT_IMAGE"

      - name: Restore persisted caches
        if: inputs.cache_mode == 'warm'
        id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          fail-on-cache-miss: true
          key: ${{ env.CACHE_KEY }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.bun/install/cache
            ~/.maps-nix-store-cache
            target

      - name: Import persisted Nix store paths
        if: inputs.variant == 'nix' && inputs.cache_mode == 'warm'
        run: |
          set -euo pipefail
          xargs sudo "$(command -v nix)" copy --no-check-sigs \
            --from "file://$HOME/.maps-nix-store-cache" < "$HOME/.maps-nix-store-cache/paths.txt"

      - name: Activate locked Nix CLI environment
        if: inputs.variant == 'nix'
        run: |
          set -euo pipefail
          nix develop --profile "$RUNNER_TEMP/maps-dev" --command bash -c 'printf "%s\n" "$PATH" >> "$GITHUB_PATH"'

      - name: Record toolchain identity
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          echo "Runner image: ${ImageOS:-unknown}-${ImageVersion:-unknown}"
          echo "Flake lock digest: $(sha256sum flake.lock)"
          echo "Cargo lock digest: $(sha256sum Cargo.lock)"
          echo "Bun lock digest: $(sha256sum bun.lock)"
          echo "Agent image: ${AGENT_IMAGE:-n/a}"
          .github/provisioning/run-in-variant.sh '
            rustc --version
            cargo --version
            bun --version
            node --version
            wasm-bindgen --version
          '

      - name: Install identical package dependencies
        run: .github/provisioning/run-in-variant.sh 'bun install --frozen-lockfile'

      - name: Execute identical Rust and WASM verification
        run: |
          .github/provisioning/run-in-variant.sh '
            bun run verify:rust
            bun run build:wasm
            test -s dist/wasm/maps_wasm_bg.wasm
          '

      - name: Export Nix store paths for warm samples
        if: inputs.variant == 'nix' && inputs.cache_mode == 'prime'
        run: |
          set -euo pipefail
          cache="$HOME/.maps-nix-store-cache"
          mkdir -p "$cache"
          {
            nix path-info --recursive "$RUNNER_TEMP/maps-dev"
            nix flake archive --json | jq -r '.path, (.inputs[]?.path)'
          } | sort -u > "$cache/paths.txt"
          xargs nix copy --to "file://$cache" < "$cache/paths.txt"
          du -sh "$cache"

      - name: Save persisted caches
        if: inputs.cache_mode == 'prime'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ env.CACHE_KEY }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.bun/install/cache
            ~/.maps-nix-store-cache
            target

      - name: Record independent experimental sample
        if: always()
        env:
          CACHE_MODE: ${{ inputs.cache_mode }}
          SAMPLE: ${{ inputs.sample }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit || 'n/a' }}
        run: |
          {
            echo "| Provisioner | Cache mode | Cache hit | Sample | Source |"
            echo "| --- | --- | --- | ---: | --- |"
            echo "| $VARIANT | $CACHE_MODE | $CACHE_HIT | $SAMPLE | $(git rev-parse HEAD) |"
          } >> "$GITHUB_STEP_SUMMARY"
