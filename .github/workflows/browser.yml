name: Full Browser Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 2"

permissions:
  contents: read
  packages: read

jobs:
  browser-validation:
    name: Full Browser Validation
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@workflow-standard-v1
    permissions:
      contents: read
      packages: read
    with:
      bun_version: "1.3.14"
      pre_command: bunx playwright install --with-deps chromium
      e2e_command: bun run test:browser -- --project=chromium
      install_playwright: false
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
