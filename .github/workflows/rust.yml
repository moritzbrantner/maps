name: Rust

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust-validation:
    name: Rust Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default 1.98.1

      # One hosted bootstrap for #38; this step and write permission are removed after the lock commit.
      - name: Bootstrap Cargo.lock
        run: cargo generate-lockfile

      - name: Commit Cargo.lock bootstrap
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/maps-rust-clustering-38'
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Commit clustering Cargo.lock bootstrap"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Check WASM target
        run: cargo check -p maps-wasm --target wasm32-unknown-unknown --locked

  aggregation-parity:
    name: Aggregation Parity
    needs: rust-validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Bootstrap Cargo.lock
        run: cargo generate-lockfile

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build TypeScript control
        run: bun run build:js

      - name: Run Rust candidate fixtures
        run: cargo run -p maps-core --example aggregation_parity --locked -- fixtures/aggregation-parity.json > /tmp/rust-aggregation.json

      - name: Compare control and candidate
        run: bun scripts/verify-rust-aggregation-parity.mjs fixtures/aggregation-parity.json /tmp/rust-aggregation.json
