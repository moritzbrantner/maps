name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  packages: read

jobs:
  performance-validation:
    name: Performance Validation
    uses: moritzbrantner/reusable-workflows/.github/workflows/performance-validation.yml@workflow-standard-v1
    permissions:
      contents: read
      packages: read
    with:
      bun_version: "1.3.14"
      benchmark_command: bun run verify:benchmarks && bun run bench:temporal-geojson && bun run bench:performance
      upload_artifacts_on: always
      artifact_name_suffix: -benchmarks
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
