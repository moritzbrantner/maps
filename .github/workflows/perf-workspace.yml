name: Format benchmark candidate
on:
  push:
    branches: [diagnostics/maps-perf-next-20260924]
    paths: [.github/workflows/perf-workspace.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pages-benchmark-lab
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format exact candidate
        shell: bash
        run: |
          bun run format
          git diff --check
          if git diff --quiet; then exit 0; fi
          git add demo package.json .oxfmtrc.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: format benchmark lab'
          git push origin HEAD:feat/pages-benchmark-lab
