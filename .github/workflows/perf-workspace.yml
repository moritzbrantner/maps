name: Maps instanced circle candidate
on:
  push:
    branches: [diagnostics/maps-perf-next-20260924]
    paths:
      - .github/workflows/perf-workspace.yml
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/maps-perf-next-20260924
      - name: Apply verified renderer patch to current-main candidate
        shell: bash
        run: |
          cat .diagnostics/instanced-circles.{1,2,3} | base64 -d | gzip -d > /tmp/candidate.patch
          echo '9f8a272c0377a7a547b53c7b1d58ac2310a0e1e51be6832c1248136172288b87  /tmp/candidate.patch' | sha256sum --check
          git fetch origin perf/instanced-application-circles
          git switch perf/instanced-application-circles
          git reset --hard 1352926d45ed19dd26aeb7eaeb95515aff3164fe
          git apply --check /tmp/candidate.patch
          git apply /tmp/candidate.patch
          git diff --check
          git add crates/maps-wasm/src/wgpu_base_map.rs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'perf: instance dense application circles on WebGPU'
          git push --force-with-lease origin HEAD:perf/instanced-application-circles
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - name: Format candidate and run Rust validation
        shell: bash
        run: |
          cargo fmt --all
          git diff --check
          if ! git diff --quiet; then
            git add crates/maps-wasm/src/wgpu_base_map.rs
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: format instanced circle renderer'
            git push origin HEAD
          fi
          cargo test -p maps-wasm --locked
          cargo clippy -p maps-wasm --all-targets --locked -- -D warnings
