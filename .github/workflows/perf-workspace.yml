name: Packed projection matched baseline
on:
  push:
    branches: [diagnostics/maps-perf-next-20260924]
    paths: [.github/workflows/perf-workspace.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f7ba3a09512c6fcab77ca2a862035171e9d02ff0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - name: Match candidate verification warmup
        run: |
          mkdir -p evidence
          bun run verify:agent > evidence/verify-agent.log 2>&1
          bun run verify:rust > evidence/verify-rust.log 2>&1
      - name: Build base WASM
        run: |
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          bun run build:wasm
          rm -rf public/wasm
          mkdir -p public/wasm
          cp dist/wasm/maps_wasm.js dist/wasm/maps_wasm_bg.wasm public/wasm/
      - run: bunx playwright install --with-deps chromium
      - name: Exact matched browser sequence
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: evidence/playwright-report
        run: |
          bun run test:browser --project=chromium e2e/maps-camera-presentation.spec.ts e2e/maps-runtime-performance.spec.ts --output=evidence/test-results 2>&1 | tee evidence/browser.log
      - name: Retain baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-projection-baseline
          path: evidence
          retention-days: 7
