name: Deploy Example Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build-example:
    name: Build or reuse Example artifact
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@680d4f7bda61361b10865d8835bc7ef69a24061b
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: maps-example-pages-v4
      rust_toolchain: "1.99.0"
      rust_targets: wasm32-unknown-unknown
      bun_version: "1.3.14"
      node_version: "24"
      cache_bun: true
      bun_cache_dependency_path: bun.lock
      use_environment_v1: false
      setup_command: |
        bun install --frozen-lockfile
        bunx playwright install --with-deps chromium
        cargo install wasm-bindgen-cli --version 0.2.129 --locked
        rm -rf .github-pages-template
        git init .github-pages-template
        git -C .github-pages-template remote add origin https://github.com/moritzbrantner/github-pages-template.git
        git -C .github-pages-template fetch --depth 1 origin 28321ce9f7214f504a3e454dcfeca5e53eeb6cdc
        git -C .github-pages-template checkout --detach FETCH_HEAD
      build_command: |
        bun run build:wasm
        rm -rf public/wasm
        mkdir -p public/wasm
        cp dist/wasm/maps_wasm.js dist/wasm/maps_wasm_bg.wasm public/wasm/
        bun run bench:engine -- --output public/evidence/engine-benchmark.json
        VITE_MAPS_WASM_SHOWCASE=1 bunx --bun vite build --base "/${{ github.event.repository.name }}/"
        mkdir -p dist/benchmarks
        cp dist/index.html dist/benchmarks/index.html
        bun run bench:engine:interaction -- --output dist/evidence/engine-interaction.json
        node .github-pages-template/bin/github-pages-template.mjs build --config ./pages.config.json --out ./dist --augment
        # Descriptive interaction benchmarks (SwiftShader, shared runner), appended to the
        # history published at /benchmarks/history.json. A failed run republishes the
        # previous history instead of blocking the deploy; unreadable history fails it.
        history_url="https://moritzbrantner.github.io/${{ github.event.repository.name }}/benchmarks/history.json"
        mkdir -p dist/benchmarks
        if CI=1 node scripts/benchmark-interactions.mjs --engines=maps-wgpu,maps-canvas2d,maplibre --basemaps=vector,raster --repeats=2 --json=benchmark-results/interactions.json; then
          node scripts/build-benchmark-history.mjs --run=benchmark-results/interactions.json --previous="$history_url" --out=dist/benchmarks/history.json
        else
          echo "::warning::Interaction benchmark failed; republishing the previous benchmark history."
          curl -fsSL "$history_url" -o dist/benchmarks/history.json || rm -f dist/benchmarks/history.json
        fi
      artifact_paths: dist
      reuse_across_runs: true
      artifact_retention_days: 7

  verify-hosted-example:
    name: Verify hosted Example
    needs: build-example
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@680d4f7bda61361b10865d8835bc7ef69a24061b
    with:
      node_version: "24"
      bun_version: "1.3.14"
      install_command: bun install --frozen-lockfile
      prebuilt_artifact_run_id: ${{ needs.build-example.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-example.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-example.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-example.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-example.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-example.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-example.outputs.identity_digest }}
      prebuilt_artifact_destination: dist
      e2e_command: bunx playwright test --config playwright.hosted.config.ts
      install_playwright: true
      install_playwright_browsers: chromium
      artifact_paths: |
        playwright-report-hosted
        test-results-hosted
      artifact_name_suffix: "-hosted-pages"
      upload_artifacts_on: failure

  deploy-example:
    name: Deploy Example
    needs:
      - build-example
      - verify-hosted-example
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@680d4f7bda61361b10865d8835bc7ef69a24061b
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      build_command: ""
      artifact_path: dist
      prebuilt_artifact_run_id: ${{ needs.build-example.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-example.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-example.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-example.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-example.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-example.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-example.outputs.identity_digest }}
      cache_bun: false
      cache_node: false
