name: Deploy Example Website

on:
  pull_request:
    paths:
      - "crates/**"
      - "demo/**"
      - "src/**"
      - "scripts/build-maps-wasm.mjs"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "vite.config.*"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build-example:
    name: Build Example
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
      packages: read
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache Bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: Build hosted Rust/WASM runtime
        run: |
          bun run build:wasm
          rm -rf public/wasm
          mkdir -p public/wasm
          cp dist/wasm/maps_wasm.js dist/wasm/maps_wasm_bg.wasm public/wasm/

      - name: Build example website
        env:
          VITE_MAPS_WASM_SHOWCASE: "1"
        run: bunx --bun vite build --base "/${{ github.event.repository.name }}/"

      - name: Configure GitHub Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-example:
    name: Deploy Example
    needs: build-example
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
