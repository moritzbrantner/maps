name: Deploy Maps Engine Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  # Superseded previews must not consume another long browser-runner slot.
  # Main deployments still complete in order to preserve published evidence.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-example:
    name: Build or reuse Maps Pages artifact
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@680d4f7bda61361b10865d8835bc7ef69a24061b
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      # PR previews omit publication-only measurements. Distinct receipt keys
      # prevent a PR artifact from being reused for a same-SHA main deployment.
      artifact_key: ${{ github.event_name == 'pull_request' && 'maps-engine-pages-pr-v2' || 'maps-engine-pages-publish-v2' }}
      rust_toolchain: stable
      rust_targets: wasm32-unknown-unknown
      bun_version: latest
      node_version: lts/*
      cache_bun: true
      bun_cache_dependency_path: bun.lock
      use_environment_v1: false
      setup_command: |
        bun install --frozen-lockfile
        bunx playwright install --with-deps chromium
        bash scripts/install-wasm-bindgen-ci.sh
        if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
          python3 -m venv "$RUNNER_TEMP/flip"
          "$RUNNER_TEMP/flip/bin/pip" install --quiet flip-evaluator numpy pillow
        fi
        rm -rf .github-pages-template
        git init .github-pages-template
        git -C .github-pages-template remote add origin https://github.com/moritzbrantner/github-pages-template.git
        git -C .github-pages-template fetch --depth 1 origin 28321ce9f7214f504a3e454dcfeca5e53eeb6cdc
        git -C .github-pages-template checkout --detach FETCH_HEAD
        git init "$RUNNER_TEMP/maps-runtime-profiler-source"
        git -C "$RUNNER_TEMP/maps-runtime-profiler-source" remote add origin https://github.com/moritzbrantner/runtime-profiler.git
        git -C "$RUNNER_TEMP/maps-runtime-profiler-source" fetch --depth 1 origin 6211c8470db3a3b616d8e107c77f7fd347ae7cb6
        git -C "$RUNNER_TEMP/maps-runtime-profiler-source" checkout --detach FETCH_HEAD
        GH_TOKEN="${{ github.token }}" bash scripts/install-runtime-profiler-ci.sh "$RUNNER_TEMP/maps-profiler/bin/runtime-profiler"
        git fetch --deepen=1 origin "$(git rev-parse HEAD)"
        git worktree add --detach "$RUNNER_TEMP/maps-kernel-reference" HEAD^
        if [ -f "$RUNNER_TEMP/maps-kernel-reference/scripts/run-engine-kernel-scenario.mjs" ]; then
          (cd "$RUNNER_TEMP/maps-kernel-reference" && bun install --frozen-lockfile)
        fi
      build_command: |
        bun run build:wasm
        rm -rf public/wasm
        mkdir -p public/wasm
        cp dist/wasm/maps_wasm.js dist/wasm/maps_wasm_bg.wasm public/wasm/
        bun run bench:engine -- --output public/evidence/engine-benchmark.json
        VITE_MAPS_WASM_SHOWCASE=1 bunx --bun vite build --base "/${{ github.event.repository.name }}/"
        # Vite now builds /benchmarks/ as a distinct reference lab entrypoint.
        # Copying the first-party home page would erase the benchmark route.
        # CI owns the required MapLibre oracle gate on PRs. Publish the report
        # only with deployable builds, avoiding a duplicate 7-9 minute PR run.
        if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
          if ! CI=1 ORACLE_PYTHON="$RUNNER_TEMP/flip/bin/python" bun run oracle -- --out dist/oracle; then
            echo "::warning::MapLibre oracle gate failed; publishing its report anyway."
          fi
        fi
        bun run bench:engine:interaction -- --output dist/evidence/engine-interaction.json
        # Capture exact parent/candidate kernel harnesses. The profiler owns
        # immutable bundles, strict comparison and history; these shared-runner
        # process observations are descriptive, separate from the kernel gate.
        RUNTIME_PROFILER_BIN="$RUNNER_TEMP/maps-profiler/bin/runtime-profiler" \
          RUNTIME_PROFILER_SOURCE="$RUNNER_TEMP/maps-runtime-profiler-source" \
          bun run profile:engine-kernels -- \
          --reference="$RUNNER_TEMP/maps-kernel-reference" \
          --output=dist/evidence/kernels \
          --report=dist/evidence/kernel-runtime.json \
          --previous-history="https://moritzbrantner.github.io/${{ github.event.repository.name }}/evidence/kernels"
        git worktree remove "$RUNNER_TEMP/maps-kernel-reference"
        # Dense-point journey lanes (#197): descriptive evidence that never blocks the deploy.
        # A failed run publishes nothing, so /stats/ shows the source as unavailable.
        if ! CI=1 bun run bench:point-journey -- --repeats=1 --json=dist/evidence/point-journey.json; then
          echo "::warning::Point-journey benchmark failed; its evidence stays unavailable."
          rm -f dist/evidence/point-journey.json
        fi
        node .github-pages-template/bin/github-pages-template.mjs build --config ./pages.config.json --out ./dist --augment
        # The published history contains main-only descriptive measurements.
        # PR previews display that existing history without inventing a new
        # candidate observation or repeating a 9-14 minute browser benchmark.
        # A failed main benchmark republishes previous history; a failed history
        # fetch remains a real error rather than a fabricated empty report.
        history_url="https://moritzbrantner.github.io/${{ github.event.repository.name }}/benchmarks/history.json"
        mkdir -p dist/benchmarks
        if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && CI=1 node scripts/benchmark-interactions.mjs --engines=maps-wgpu,maps-canvas2d,maplibre --basemaps=vector,raster --repeats=2 --json=benchmark-results/interactions.json; then
          node scripts/build-benchmark-history.mjs --run=benchmark-results/interactions.json --previous="$history_url" --out=dist/benchmarks/history.json
        else
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "PR preview: retaining published main benchmark history without new measurements."
          else
            echo "::warning::Interaction benchmark failed; republishing the previous benchmark history."
          fi
          # Republish the previous history; only a missing history (first run) may be absent.
          status=$(curl -sSL -o dist/benchmarks/history.json -w "%{http_code}" "$history_url" || echo 000)
          case "$status" in
            200) ;;
            404) rm -f dist/benchmarks/history.json ;;
            *) echo "::error::Could not read the published benchmark history (HTTP $status)."; exit 1 ;;
          esac
        fi
      artifact_paths: dist
      reuse_across_runs: true
      artifact_retention_days: 7

  verify-hosted-example:
    name: Verify hosted Maps Pages
    needs: build-example
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@680d4f7bda61361b10865d8835bc7ef69a24061b
    with:
      node_version: lts/*
      bun_version: latest
      install_command: bun install --frozen-lockfile
      prebuilt_artifact_run_id: ${{ needs.build-example.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-example.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-example.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-example.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-example.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-example.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-example.outputs.identity_digest }}
      prebuilt_artifact_destination: dist
      e2e_command: bunx playwright test --config playwright.hosted.config.ts
      install_playwright: true
      install_playwright_browsers: chromium
      artifact_paths: |
        playwright-report-hosted
        test-results-hosted
      artifact_name_suffix: "-hosted-pages"
      upload_artifacts_on: failure

  deploy-example:
    name: Deploy Maps Pages
    needs:
      - build-example
      - verify-hosted-example
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@680d4f7bda61361b10865d8835bc7ef69a24061b
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      build_command: ""
      artifact_path: dist
      prebuilt_artifact_run_id: ${{ needs.build-example.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-example.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-example.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-example.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-example.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-example.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-example.outputs.identity_digest }}
      cache_bun: false
      cache_node: false
