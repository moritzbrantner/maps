name: Temporary convergence snapshot refresh

on:
  push:
    branches:
      - fix/browser-convergence-ui-sources

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/browser-convergence-ui-sources
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser:smoke -- --update-snapshots
      - name: Commit refreshed snapshots
        shell: bash
        run: |
          git add e2e/__screenshots__
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh browser snapshots for UI source styles"
          git push origin HEAD:fix/browser-convergence-ui-sources
