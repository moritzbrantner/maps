name: Format decoupled demo UI

on:
  push:
    branches:
      - decouple-ui

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decouple-ui
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx oxfmt --write demo/ui.tsx
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/format-decouple-ui.yml
          git add demo/ui.tsx
          git commit -m 'style: format local demo ui'
          git push origin HEAD:decouple-ui
