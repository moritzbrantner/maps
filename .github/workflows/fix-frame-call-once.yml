name: Fix compatibility frame call

on:
  push:
    branches:
      - feat/maps-native-runtime-final

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: feat/maps-native-runtime-final
      - name: Route frame probe through compatibility helper
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/map-native-components.tsx')
          text = p.read_text()
          old = '''    compatibilityEngine.computeFrame({
              layerIds: [compatibilityLayerId],
              viewport: {
                bounds: [-180, -90, 180, 90],
                center: surface.viewState.center,
                display: surface.display,
                height: 1,
                kind: "geo",
                width: 1,
                zoom: surface.viewState.zoom,
              },
            });'''
          new = '''    callCompatibilityEngine(compatibilityEngine, "computeFrame", {
              layerIds: [compatibilityLayerId],
              viewport: {
                bounds: [-180, -90, 180, 90],
                center: surface.viewState.center,
                display: surface.display,
                height: 1,
                kind: "geo",
                width: 1,
                zoom: surface.viewState.zoom,
              },
            });'''
          if old not in text:
              raise SystemExit('computeFrame compatibility call did not match')
          p.write_text(text.replace(old, new, 1))
          Path('.github/workflows/fix-frame-call-once.yml').unlink()
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/map-native-components.tsx .github/workflows/fix-frame-call-once.yml
          git commit -m "fix: route compatibility frame calls through helper"
          git push origin HEAD:feat/maps-native-runtime-final
