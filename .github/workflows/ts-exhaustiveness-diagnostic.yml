name: TS exhaustiveness diagnostic

on:
  push:
    branches:
      - chore/repository-foundation-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Run TS-005
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ts-005.json" <<'JSON'
          {
            "options": {"typeAware": true},
            "rules": {
              "typescript/switch-exhaustiveness-check": ["error", {"considerDefaultExhaustiveForUnions": false}]
            }
          }
          JSON
          bunx oxlint --config "$RUNNER_TEMP/ts-005.json" .
