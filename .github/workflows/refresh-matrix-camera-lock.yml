name: Refresh matrix camera lock

on:
  push:
    branches:
      - feat/maps-matrix-camera

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/maps-matrix-camera
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Resolve pinned workspace dependencies
        run: cargo check -p maps-core
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh matrix camera dependency lock"
          git push origin HEAD:feat/maps-matrix-camera
