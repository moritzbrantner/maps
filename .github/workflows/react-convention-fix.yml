name: React convention fix

on:
  push:
    branches:
      - chore/repository-foundation-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: chore/repository-foundation-v1
          fetch-depth: 0
      - name: Remove state synchronization effects
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/measurement-map-layer.tsx",
              '''  useEffect(() => {\n    if (!isMeasuring && draft) {\n      setDraft(null);\n      emitDraftChange(null);\n    }\n  }, [draft, isMeasuring]);\n\n''',
              "",
          )

          replace_once(
              "src/measurement-layer.ts",
              '''  useEffect(() => {\n    if (isMeasuring) {\n      return;\n    }\n\n    setDraft((current) => {\n      if (current) {\n        emitDraftChange(null);\n      }\n\n      return null;\n    });\n  }, [emitDraftChange, isMeasuring]);\n\n''',
              "",
          )

          replace_once(
              "src/map-view-state.ts",
              '''  useEffect(() => {\n    if (controlled || areMapViewStatesEqual(uncontrolledViewState, latestViewState)) {\n      return;\n    }\n\n    setUncontrolledViewState(latestViewState);\n  }, [controlled, latestViewState, uncontrolledViewState]);\n\n''',
              '''  if (!controlled && !areMapViewStatesEqual(uncontrolledViewState, latestViewState)) {\n    setUncontrolledViewState(latestViewState);\n  }\n\n''',
          )

          temporal_state_old = '''  const [uncontrolledTime, setUncontrolledTime] = useState(() =>\n    getInitialTime(defaultTime, timeRange),\n  );\n  const [isPlaying, setIsPlaying] = useState(autoPlay);\n  const resolvedTime = currentTime ?? uncontrolledTime;\n'''
          temporal_state_new = '''  const [uncontrolledTime, setUncontrolledTime] = useState(() =>\n    getInitialTime(defaultTime, timeRange),\n  );\n  const [isPlaying, setIsPlaying] = useState(autoPlay);\n  const [previousAutoPlay, setPreviousAutoPlay] = useState(autoPlay);\n\n  if (previousAutoPlay !== autoPlay) {\n    setPreviousAutoPlay(autoPlay);\n    setIsPlaying(autoPlay);\n  }\n\n  if (currentTime === undefined && timeRange) {\n    const constrainedUncontrolledTime = clampTime(uncontrolledTime, timeRange);\n    if (constrainedUncontrolledTime !== uncontrolledTime) {\n      setUncontrolledTime(constrainedUncontrolledTime);\n    }\n  }\n\n  const resolvedTime = currentTime ?? uncontrolledTime;\n'''
          temporal_effects = '''  useEffect(() => {\n    setIsPlaying(autoPlay);\n  }, [autoPlay]);\n\n  useEffect(() => {\n    if (!timeRange || currentTime !== undefined) {\n      return;\n    }\n\n    setUncontrolledTime((value) => clampTime(value, timeRange));\n  }, [currentTime, timeRange]);\n\n'''
          for path in ["src/temporal-map.tsx", "src/temporal-heat-map.tsx"]:
              replace_once(path, temporal_state_old, temporal_state_new)
              replace_once(path, temporal_effects, "")

          replace_once(
              "demo/components/HistoryDemoView.tsx",
              '''  useEffect(() => {\n    setIsPlaying(false);\n    setYear(historyStartYear);\n  }, [historyStartYear, scenarioId]);\n\n''',
              "",
          )
          replace_once(
              "demo/components/HistoryDemoView.tsx",
              '''              onClick={() => {\n                setScenarioId(scenario.id);\n              }}\n''',
              '''              onClick={() => {\n                if (scenario.id === scenarioId) {\n                  return;\n                }\n\n                const nextScenario = getDemoHistoricalPolityScenario(scenario.id);\n                setIsPlaying(false);\n                setScenarioId(scenario.id);\n                setYear(nextScenario.scenes[0]!.year);\n              }}\n''',
          )

          replace_once(
              "src/geojson-editor.tsx",
              '''  const [uncontrolledTimelineDocument, setUncontrolledTimelineDocument] =\n    useState(generatedTimelineDocument);\n''',
              '''  const [uncontrolledTimelineDocument, setUncontrolledTimelineDocument] =\n    useState(generatedTimelineDocument);\n  const [previousGeneratedTimelineDocument, setPreviousGeneratedTimelineDocument] =\n    useState(generatedTimelineDocument);\n\n  if (\n    !timelineDocument &&\n    previousGeneratedTimelineDocument !== generatedTimelineDocument\n  ) {\n    setPreviousGeneratedTimelineDocument(generatedTimelineDocument);\n    setUncontrolledTimelineDocument(generatedTimelineDocument);\n  }\n''',
          )
          replace_once(
              "src/geojson-editor.tsx",
              '''  useEffect(() => {\n    if (!timelineDocument) {\n      setUncontrolledTimelineDocument(generatedTimelineDocument);\n    }\n  }, [generatedTimelineDocument, timelineDocument]);\n\n''',
              "",
          )

          replace_once(
              "src/map-view.tsx",
              '''  const [isReady, setIsReady] = useState(false);\n''',
              '''  const [mapLibreReady, setMapLibreReady] = useState(false);\n  const isReady = !usesMapLibreRuntime || mapLibreReady;\n''',
          )
          replace_once(
              "src/map-view.tsx",
              '''    if (!usesMapLibreRuntime) {\n      setIsReady(true);\n      return;\n    }\n''',
              '''    if (!usesMapLibreRuntime) {\n      return;\n    }\n''',
          )
          path = Path("src/map-view.tsx")
          text = path.read_text()
          if text.count("setIsReady(") != 2:
              raise SystemExit(f"src/map-view.tsx: expected two remaining setIsReady calls, found {text.count('setIsReady(')}")
          path.write_text(text.replace("setIsReady(", "setMapLibreReady("))
          PY

          git add src demo/components/HistoryDemoView.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: remove derived state effects"
          git push origin HEAD:chore/repository-foundation-v1
