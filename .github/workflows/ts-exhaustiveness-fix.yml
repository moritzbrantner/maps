name: TS exhaustiveness fix

on:
  push:
    branches:
      - chore/repository-foundation-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: chore/repository-foundation-v1
          fetch-depth: 0
      - name: Cover the optional geography kind explicitly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('demo/App.tsx')
          text = path.read_text()
          old = '''    case "operating-area":\n      return {\n        polygonFillColor: "#f59e0b",\n        polygonFillOpacity: 0.12,\n        polygonStrokeColor: "#b45309",\n        polygonStrokeWidth: 2,\n      };\n    default:\n'''
          new = '''    case "operating-area":\n      return {\n        polygonFillColor: "#f59e0b",\n        polygonFillOpacity: 0.12,\n        polygonStrokeColor: "#b45309",\n        polygonStrokeWidth: 2,\n      };\n    case undefined:\n    default:\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one target switch, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git add demo/App.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: cover optional geography kind"
          git push origin HEAD:chore/repository-foundation-v1
