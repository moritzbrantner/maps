[workspace]
members = [
  "crates/maps-core",
  "crates/maps-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/moritzbrantner/maps"

[workspace.dependencies]
maps-core = { path = "crates/maps-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.105"
