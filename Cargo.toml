[workspace]
members = [
  "crates/maps-core",
  "crates/maps-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"
repository = "https://github.com/moritzbrantner/maps"

[workspace.dependencies]
earcut = "=0.4.11"
geo-core = { package = "moenarch-geo-core", version = "=0.1.0" }
geojson = "=1.0.0"
getrandom = "=0.4.3"
maps-core = { path = "crates/maps-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde-json = { package = "serde_json", version = "=1.0.154" }
serde-wasm-bindgen = "=0.6.5"
supercluster = { version = "=3.0.8", features = ["cluster_metadata"] }
three-d-camera = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "db9a53a4aaaad28d5bd0d3fad131fc151953e989" }
three-d-animation = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "db9a53a4aaaad28d5bd0d3fad131fc151953e989" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "db9a53a4aaaad28d5bd0d3fad131fc151953e989" }
three-d-projective = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "db9a53a4aaaad28d5bd0d3fad131fc151953e989" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement", "ImageBitmap"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["webgpu", "wgsl"] }

[profile.release]
codegen-units = 1
lto = true
# Speed over size (#343, #268): "z" left iterator adapters uninlined in per-frame geometry.
opt-level = 3
panic = "abort"
strip = "symbols"
