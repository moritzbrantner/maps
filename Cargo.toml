[workspace]
members = [
    "crates/maps-core",
    "crates/maps-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
repository = "https://github.com/moritzbrantner/maps"

[workspace.dependencies]
geo-core = { package = "moenarch-geo-core", version = "=0.1.0" }
geojson = "=0.24.2"
maps-core = { path = "crates/maps-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde-json = { package = "serde_json", version = "=1.0.151" }
serde-wasm-bindgen = "=0.6.5"
supercluster = { version = "=3.0.8", features = ["cluster_metadata"] }
wasm-bindgen = "=0.2.128"
