[workspace]
members = [
  "crates/maps-core",
  "crates/maps-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
repository = "https://github.com/moritzbrantner/maps"

[workspace.dependencies]
maps-core = { path = "crates/maps-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
wasm-bindgen = "=0.2.128"
